name: Deploy Firestore rules
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/deploy-firestore-rules.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Write existing Firebase service account
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          test -n "$FIREBASE_SA"
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Deploy rules
        run: npx --yes firebase-tools@14.20.0 deploy --only firestore:rules --project leren-be --non-interactive
