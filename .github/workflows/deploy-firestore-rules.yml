name: Deploy Firestore rules
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - tools/deploy-firestore-rules.cjs
      - .github/workflows/deploy-firestore-rules.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Firebase Admin SDK
        run: npm install --no-save --no-audit --no-fund firebase-admin@13.5.0
      - name: Deploy rules
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: node tools/deploy-firestore-rules.cjs
