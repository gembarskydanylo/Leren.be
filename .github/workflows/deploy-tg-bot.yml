name: Deploy Telegram bot
on:
  push:
    branches: [main]
    paths: ["tools/tg-bot/worker.js", "tools/tg-bot/content.js", "tools/tg-bot/wrangler.toml", ".github/workflows/deploy-tg-bot.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tools/tg-bot
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Deploy with wrangler
        run: npx --yes wrangler@4 deploy -c tools/tg-bot/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b0bf56f30d5188f0da28d699847e793d
