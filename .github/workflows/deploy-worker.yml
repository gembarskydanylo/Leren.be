name: Deploy AI worker
on:
  push:
    branches: [main]
    paths: ["tools/ai-worker.js", "wrangler.toml", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            tools/ai-worker.js
            wrangler.toml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Deploy with wrangler
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b0bf56f30d5188f0da28d699847e793d
      - name: Check the live worker
        run: |
          sleep 10
          v=$(grep -o 'WORKER_VERSION = "[^"]*"' tools/ai-worker.js | cut -d'"' -f2)
          got=$(curl -s -o /dev/null -D - https://leren-ai.gembarsky-d.workers.dev/ | tr -d '\r' | awk -F': ' 'tolower($1)=="x-leren-ai"{print $2}')
          echo "expected $v, live $got"; [ "$got" = "$v" ]
