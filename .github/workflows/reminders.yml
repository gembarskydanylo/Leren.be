name: Daily reminders
on:
  schedule:
    - cron: "7 * * * *"   # every hour; each user gets a push at their own chosen hour
  workflow_dispatch:
    inputs:
      force:
        description: "Test: send a reminder to every subscriber right now"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save web-push@3.6.7 google-auth-library@9.14.2
      - run: node tools/send-reminders.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          FORCE: ${{ inputs.force }}
