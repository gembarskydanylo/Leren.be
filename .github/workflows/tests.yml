name: Tests
# LerenBe 3.0 integration: tests only. Runs on pull requests and by hand; it never deploys anything
# (no Pages, no Worker, no Firebase, no secrets). Deployments stay in their own workflows, which run on main only.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch production main for the upgrade test
        shell: bash
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Install browser test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/leren-test-deps" --no-audit --no-fund --package-lock=false playwright@1.64.1
          echo "NODE_PATH=$RUNNER_TEMP/leren-test-deps/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/leren-test-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Production tests (tests/*.cjs)
        shell: bash
        run: |
          set -e
          for test in tests/*.cjs; do
            echo "::group::$test"; node "$test"; echo "::endgroup::"
          done
      - name: LerenBe 3.0 tests (tests/v3)
        shell: bash
        run: node tests/v3/run.cjs
