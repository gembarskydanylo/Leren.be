<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0c29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>Leren.be — Nederlands A1.1</title>
<style>
/* CSS ЗМІННІ ДЛЯ GLASSMORPHISM ТЕМИ */
:root {
  color-scheme: dark;
  --bg-gradient: linear-gradient(135deg, #0f0c29 0%, #202060 50%, #24243e 100%);
  --fg: #ffffff;
  --mut: rgba(255, 255, 255, 0.7);
  --glass-card: rgba(255, 255, 255, 0.08);
  --glass-card-hover: rgba(255, 255, 255, 0.14);
  --glass-border: rgba(255, 255, 255, 0.18);
  --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  --blur: blur(16px);
  
  --acc: #00d2ff;
  --acc-hover: #3a7bd5;
  --pop: #00d2ff;
  --ok: #00e676;
  --ok-bg: rgba(0, 230, 118, 0.2);
  --bad: #ff5252;
  --bad-bg: rgba(255, 82, 82, 0.2);
  --soft: rgba(255, 255, 255, 0.05);
  --amb: #ffd700;
  --hdr: rgba(255, 255, 255, 0.1);
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg-gradient: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
  --fg: #1a1c2e;
  --mut: rgba(26, 28, 46, 0.75);
  --glass-card: rgba(255, 255, 255, 0.45);
  --glass-card-hover: rgba(255, 255, 255, 0.65);
  --glass-border: rgba(255, 255, 255, 0.6);
  --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
  --blur: blur(16px);
  
  --acc: #4f46e5;
  --acc-hover: #4338ca;
  --pop: #4f46e5;
  --ok: #10b981;
  --ok-bg: rgba(16, 185, 129, 0.2);
  --bad: #ef4444;
  --bad-bg: rgba(239, 68, 68, 0.2);
  --soft: rgba(255, 255, 255, 0.25);
  --amb: #d97706;
  --hdr: rgba(255, 255, 255, 0.35);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { min-height: 100%; }

body {
  margin: 0;
  background: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--fg);
  font: 15px/1.4 system-ui, -apple-system, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}

button, select { font: inherit; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
button { touch-action: manipulation; }

main {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 12px 12px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* СКЛЯНІ БЛОКИ / КАРТКИ */
header, .stats-bar, .nav-section, .card, .modes-wrapper, .search-panel {
  background: var(--glass-card);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  border-radius: 20px;
}

/* Header */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  padding: 10px 14px;
}

.brand h1 { font-size: 18px; line-height: 1.1; margin: 0; letter-spacing: -.03em; font-weight: 800; color: var(--fg); }
.brand p { margin: 2px 0 0; color: var(--mut); font-size: 11px; }

.top-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.select-group { display: flex; align-items: center; gap: 3px; color: var(--mut); font-size: 11px; }

.lang-select, .theme-btn, .score-pill {
  background: var(--glass-card);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  color: var(--fg);
  border-radius: 12px;
  min-height: 36px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 700;
}

.theme-btn { cursor: pointer; min-width: 36px; text-align: center; }
.score-pill { color: var(--amb); font-weight: 800; white-space: nowrap; display: flex; align-items: center; }

/* Статистика */
.stats-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  font-size: 13px;
  color: var(--mut);
}
.stats-bar strong { color: var(--fg); font-weight: 700; }

/* Навігація */
.nav-section { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--mut); font-weight: 800; margin-bottom: -4px; padding-left: 2px; }

.nav-cats, .nav-subs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 4px 2px; }
.nav-cats::-webkit-scrollbar, .nav-subs::-webkit-scrollbar { display: none; }

.nav-cats button, .nav-subs button {
  background: var(--glass-card);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  padding: 8px 14px;
  color: var(--fg);
  opacity: 0.8;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  font-size: 13px;
  font-weight: 700;
  transition: all .2s ease;
}

.nav-cats button:hover, .nav-subs button:hover { background: var(--glass-card-hover); opacity: 1; }

.nav-cats button[aria-selected="true"], .nav-subs button[aria-selected="true"] {
  background: var(--acc);
  color: #ffffff;
  border-color: rgba(255, 255, 255, 0.4);
  opacity: 1;
  box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
}

.sub-wrapper { background: transparent; padding: 0; border: none; }

/* Режими гри */
.modes-wrapper {
  display: flex;
  gap: 6px;
  padding: 6px;
}

.modes-wrapper button {
  flex: 1;
  background: transparent;
  border: none;
  border-radius: 12px;
  padding: 8px 6px;
  color: var(--mut);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  white-space: nowrap;
  transition: all .2s ease;
}

.modes-wrapper button.primary {
  background: var(--acc);
  color: #fff;
  box-shadow: 0 4px 12px rgba(0, 210, 255, 0.35);
}

.meta { display: flex; justify-content: space-between; gap: 8px; color: var(--mut); font-size: 11px; font-weight: 600; padding: 0 2px; }

.bar { height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; overflow: hidden; backdrop-filter: var(--blur); }
.bar i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .25s ease; }

/* Основна картка */
.card { padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.q { text-align: center; }
.q small { color: var(--mut); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 800; }
.icon-box { font-size: 48px; margin: 6px 0; line-height: 1; }
.q h2 { font-size: clamp(22px, 5vw, 30px); font-weight: 800; margin: 6px 0 2px; letter-spacing: -.03em; word-break: break-word; }
.q p { margin: 0; color: var(--mut); font-size: 14px; }

.listen {
  background: var(--glass-card);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  color: var(--fg);
  border-radius: 16px;
  padding: 6px 16px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
  min-height: 36px;
  transition: all .2s ease;
}
.listen:hover, .btn:hover, .opt:hover:not(:disabled) { border-color: var(--acc); background: var(--glass-card-hover); }

/* Годинник */
.clock-visual {
  width: 110px; height: 110px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.05);
  border: 2px solid var(--glass-border);
  margin: 10px auto 4px; position: relative;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: var(--blur);
}
.clock-center { width: 8px; height: 8px; background: var(--acc); border-radius: 50%; position: absolute; z-index: 3; }
.clock-hand-h { width: 3px; height: 32px; background: var(--fg); position: absolute; bottom: 55px; left: 53.5px; border-radius: 2px; transform-origin: bottom center; z-index: 2; }
.clock-hand-m { width: 2px; height: 44px; background: var(--acc); position: absolute; bottom: 55px; left: 54px; border-radius: 2px; transform-origin: bottom center; z-index: 1; }

/* Варіанти відповідей */
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

.opt {
  background: var(--glass-card);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  color: var(--fg);
  border-radius: 16px;
  padding: 12px 10px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-align: center;
  min-height: 52px;
  word-break: break-word;
  transition: all .2s ease;
}

.opt:active:not(:disabled) { transform: scale(.98); }

.opt.correct {
  background: var(--ok-bg) !important;
  border-color: var(--ok) !important;
  color: #fff !important;
  box-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
}

.opt.incorrect {
  background: var(--bad-bg) !important;
  border-color: var(--bad) !important;
  color: #fff !important;
}

.opt:disabled { cursor: default; }
.swatch { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--glass-border); flex-shrink: 0; }

.feedback { border-radius: 14px; padding: 10px 12px; text-align: center; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--glass-border); }
.feedback:empty { display: none; }
.feedback strong { display: block; font-size: 14px; }
.feedback p { margin: 2px 0 0; color: var(--mut); font-size: 12px; }
.feedback .example { margin-top: 4px; color: var(--fg); font-weight: 600; }

.row { display: flex; gap: 8px; flex-wrap: wrap; }

.btn {
  flex: 1;
  min-width: 100px;
  padding: 10px 14px;
  border-radius: 14px;
  border: 1px solid var(--glass-border);
  background: var(--glass-card);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  color: var(--fg);
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  min-height: 44px;
  font-size: 14px;
  transition: all .2s ease;
}

.btn.primary { background: var(--acc); border-color: rgba(255, 255, 255, 0.4); color: #fff; box-shadow: 0 4px 15px rgba(0, 210, 255, 0.35); }
.btn.primary:hover { background: var(--acc-hover); }

.end { text-align: center; display: flex; flex-direction: column; gap: 12px; }
.end h2 { font-size: 32px; margin: 0; letter-spacing: -.04em; }
.end p { color: var(--mut); margin: 0; }

.summary-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.summary-grid div { padding: 10px 6px; border: 1px solid var(--glass-border); border-radius: 12px; background: rgba(0,0,0,0.15); }
.summary-grid strong { display: block; font-size: 16px; }
.summary-grid span { font-size: 10px; color: var(--mut); }
.empty { color: var(--mut); text-align: center; padding: 12px; font-size: 14px; }

footer { text-align: center; color: var(--mut); font-size: 11px; margin-top: 10px; display: flex; flex-direction: column; gap: 3px; line-height: 1.4; }
footer strong { color: var(--fg); font-weight: 750; }

.report-bug-btn {
  margin-top: 6px;
  background: transparent;
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 11px;
  font-weight: 700;
  color: var(--mut);
  cursor: pointer;
  transition: all .15s;
}
.report-bug-btn:hover { background: var(--glass-card-hover); color: var(--fg); }

/* Модальне вікно пошуку */
.search-modal {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 60px 12px 20px;
}
.search-modal[hidden] { display: none; }
.search-panel { border-radius: 24px; width: 100%; max-width: 480px; max-height: 75vh; display: flex; flex-direction: column; }
.search-head { display: flex; gap: 8px; padding: 14px; border-bottom: 1px solid var(--glass-border); align-items: center; }
.search-head input {
  flex: 1; border: 1px solid var(--glass-border); border-radius: 14px;
  padding: 10px 14px; font-size: 15px; background: rgba(0, 0, 0, 0.2);
  color: var(--fg); outline: none;
}
.search-head input:focus { border-color: var(--acc); }
.search-results { overflow-y: auto; padding: 10px 14px 16px; flex: 1; }
.search-item { padding: 12px; border-radius: 14px; border: 1px solid var(--glass-border); margin-bottom: 8px; background: rgba(255,255,255,0.03); cursor: pointer; }
.search-item:hover { background: var(--glass-card-hover); }
.search-item .nl { font-weight: 800; font-size: 16px; margin-bottom: 2px; }
.search-item .tr { color: var(--mut); font-size: 13px; }
.search-item .ex { font-size: 12px; margin-top: 4px; color: var(--fg); opacity: .8; }
.search-empty { text-align: center; color: var(--mut); padding: 24px 8px; font-size: 14px; }

.q h2.sm { font-size: 18px; letter-spacing: -.02em; }
.slots, .bank { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; direction: ltr; }
.bank { min-height: 40px; }
.sw2 { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.sw2.rQ { --rc: var(--acc); } .sw2.rV { --rc: var(--ok); } .sw2.rS { --rc: var(--amb); } .sw2.rR { --rc: var(--mut); }
.role { font-size: 9px; letter-spacing: .05em; text-transform: uppercase; font-weight: 800; color: var(--rc); }

.slot {
  min-width: 54px; min-height: 40px; padding: 4px 8px; border-radius: 10px;
  border: 1px dashed var(--glass-border); border-bottom: 3px solid var(--rc);
  background: rgba(0,0,0,0.15); color: var(--fg); font: inherit; font-weight: 600;
  font-size: 13px; cursor: pointer;
}
.slot.filled { border-style: solid; background: var(--glass-card); }
.slot.bad { border-color: var(--bad); border-bottom-color: var(--bad); color: var(--bad); background: var(--bad-bg); animation: shake .3s; }
.slot.good { border-color: var(--ok); border-bottom-color: var(--ok); color: var(--ok); background: var(--ok-bg); }
.tile { min-height: 38px; padding: 6px 12px; font-size: 14px; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

@media(max-width:480px) {
  main { padding: 8px 8px 18px; gap: 8px; }
  header { padding: 8px 10px; }
  .brand h1 { font-size: 16px; }
  .top-right { width: 100%; justify-content: space-between; margin-top: 2px; }
  .nav-section { padding: 8px; gap: 8px; border-radius: 16px; }
  .nav-cats button, .nav-subs button { padding: 6px 10px; font-size: 12px; }
  .modes-wrapper button { padding: 6px 2px; font-size: 11px; }
  .card { padding: 14px 12px; gap: 10px; border-radius: 16px; }
  .opt { font-size: 14px; padding: 8px 4px; min-height: 46px; }
}
</style>
</head>

      <button type="button" id="searchClose" class="theme-btn">✕</button>

    <div id="searchResults" class="search-results"></div>
  </div>
</div>
