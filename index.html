<style>
/* CSS ЗМІННІ ТА СТИЛІ GLASSMORPHISM */
:root {
  color-scheme: dark;
  --bg:#0f0c29;
  --bg-gradient: linear-gradient(135deg, #0f0c29 0%, #202060 50%, #24243e 100%);
  --fg: #ffffff;
  --mut: rgba(255, 255, 255, 0.7);
  --card: rgba(255, 255, 255, 0.08);
  --line: rgba(255, 255, 255, 0.18);
  --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  --blur: blur(16px);
  --acc: #00d2ff;
  --acc-hover: #3a7bd5;
  --ok: #00e676;
  --ok-bg: rgba(0, 230, 118, 0.2);
  --bad: #ff5252;
  --bad-bg: rgba(255, 82, 82, 0.2);
  --soft: rgba(255, 255, 255, 0.08);
  --amb: #ffd700;
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #e0c3fc;
  --bg-gradient: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
  --fg: #1a1c2e;
  --mut: rgba(26, 28, 46, 0.75);
  --card: rgba(255, 255, 255, 0.5);
  --line: rgba(255, 255, 255, 0.65);
  --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
  --blur: blur(16px);
  --acc: #4f46e5;
  --acc-hover: #4338ca;
  --ok: #10b981;
  --ok-bg: rgba(16, 185, 129, 0.2);
  --bad: #ef4444;
  --bad-bg: rgba(239, 68, 68, 0.2);
  --soft: rgba(255, 255, 255, 0.3);
  --amb: #d97706;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { min-height: 100%; }

body {
  margin: 0;
  background: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--fg);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}

button, select { font: inherit; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
button { touch-action: manipulation; }

main {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 12px 12px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Header */
header {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  background: var(--card); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  padding: 10px 14px; border-radius: 20px; border: 1px solid var(--line); box-shadow: var(--shadow);
}
.brand h1 { font-size: 18px; line-height: 1.1; margin: 0; letter-spacing: -.03em; font-weight: 800; }
.brand p { margin: 2px 0 0; color: var(--mut); font-size: 11px; }
.top-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.select-group { display: flex; align-items: center; gap: 3px; color: var(--mut); font-size: 11px; }

.lang-select, .theme-btn {
  background: var(--card); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--line); color: var(--fg); border-radius: 12px; min-height: 36px; padding: 3px 10px;
  font-size: 12px; font-weight: 700;
}
.theme-btn { cursor: pointer; min-width: 36px; text-align: center; }
.score-pill {
  border: 1px solid var(--line); background: var(--soft); color: var(--amb);
  border-radius: 12px; padding: 6px 10px; font-size: 13px; font-weight: 800; white-space: nowrap;
}

/* Статистика */
.stats-bar {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--card); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--line); border-radius: 16px; padding: 10px 16px; font-size: 12px; color: var(--mut); box-shadow: var(--shadow);
}
.stats-bar strong { color: var(--fg); font-weight: 700; }

/* Навігація */
.nav-section {
  background: var(--card); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--line); border-radius: 20px; padding: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px;
}
.section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--mut); font-weight: 800; margin-bottom: -4px; padding-left: 2px; }

.nav-cats, .nav-subs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 4px 2px; }
.nav-cats::-webkit-scrollbar, .nav-subs::-webkit-scrollbar { display: none; }

.nav-cats button, .nav-subs button {
  background: var(--card); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; color: var(--fg); opacity: 0.85;
  cursor: pointer; white-space: nowrap; flex-shrink: 0; font-size: 13px; font-weight: 700; transition: all .15s;
}
.nav-cats button[aria-selected="true"], .nav-subs button[aria-selected="true"] {
  background: var(--acc); color: #fff; border-color: rgba(255,255,255,0.4); opacity: 1; box-shadow: 0 4px 15px rgba(0, 210, 255, 0.35);
}

.sub-wrapper { background: transparent; padding: 0; border: none; }

.modes-wrapper {
  background: rgba(0, 0, 0, 0.15); border-radius: 14px; padding: 4px; display: flex; gap: 6px; border: 1px solid var(--line);
}
.modes-wrapper button {
  flex: 1; background: transparent; border: none; border-radius: 10px; padding: 8px 4px;
  color: var(--mut); font-size: 12px; font-weight: 700; cursor: pointer; text-align: center; white-space: nowrap; transition: all .15s;
}
.modes-wrapper button.primary { background: var(--acc); color: #fff; box-shadow: 0 4px 12px rgba(0, 210, 255, 0.3); }

.meta { display: flex; justify-content: space-between; gap: 8px; color: var(--mut); font-size: 11px; font-weight: 600; padding: 0 2px; }
.bar { height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; overflow: hidden; backdrop-filter: var(--blur); }
.bar i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .25s; }

/* Картка */
.card {
  background: var(--card); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--line); border-radius: 22px; padding: 18px 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0;
}
.q { text-align: center; }
.q small { color: var(--mut); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 800; }
.icon-box { font-size: 46px; margin: 4px 0; line-height: 1; }
.q h2 { font-size: clamp(20px, 4.5vw, 28px); font-weight: 800; margin: 4px 0 2px; letter-spacing: -.03em; overflow-wrap: anywhere; }
.q p { margin: 0; color: var(--mut); font-size: 13px; }

.listen {
  background: var(--card); border: 1px solid var(--line); color: var(--fg); border-radius: 14px;
  padding: 6px 14px; font-size: 12px; font-weight: 700; cursor: pointer; margin-top: 6px; min-height: 36px;
}
.listen:hover, .btn:hover, .opt:hover:not(:disabled) { border-color: var(--acc); background: rgba(255, 255, 255, 0.15); }

/* Годинник */
.clock-visual {
  width: 110px; height: 110px; border-radius: 50%; background: rgba(255, 255, 255, 0.05);
  border: 2px solid var(--line); margin: 8px auto 2px; position: relative; display: flex; align-items: center; justify-content: center;
}
.clock-center { width: 8px; height: 8px; background: var(--acc); border-radius: 50%; position: absolute; z-index: 3; }
.clock-hand-h { width: 3px; height: 32px; background: var(--fg); position: absolute; bottom: 55px; left: 53.5px; border-radius: 2px; transform-origin: bottom center; z-index: 2; }
.clock-hand-m { width: 2px; height: 44px; background: var(--acc); position: absolute; bottom: 55px; left: 54px; border-radius: 2px; transform-origin: bottom center; z-index: 1; }

/* Опції відповідей */
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt {
  background: var(--card); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--line); color: var(--fg); border-radius: 16px; padding: 12px 8px; font-size: 14.5px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; min-height: 50px; overflow-wrap: anywhere; transition: transform .1s;
}
.opt:active { transform: scale(.98); }

.opt.correct {
  background: var(--ok-bg) !important; border-color: var(--ok) !important; color: #fff !important; font-weight: 800;
}
.opt.incorrect { border-color: var(--bad) !important; color: #fff !important; background: var(--bad-bg) !important; }
.opt:disabled { cursor: default; }
.swatch { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--line); flex-shrink: 0; }

.feedback { border-radius: 12px; padding: 10px 12px; text-align: center; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--line); }
.feedback:empty { display: none; }
.feedback strong { display: block; font-size: 14px; }
.feedback p { margin: 2px 0 0; color: var(--mut); font-size: 12px; }
.feedback .example { margin-top: 4px; color: var(--fg); font-weight: 600; }

.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  flex: 1; min-width: 100px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--card); color: var(--fg); font-weight: 700; cursor: pointer; text-align: center; min-height: 44px; font-size: 14px;
}
.btn.primary { background: var(--acc); border-color: rgba(255,255,255,0.4); color: #fff; box-shadow: 0 4px 15px rgba(0, 210, 255, 0.35); }

.end { text-align: center; display: flex; flex-direction: column; gap: 10px; }
.end h2 { font-size: 32px; margin: 0; letter-spacing: -.04em; }
.end p { color: var(--mut); margin: 0; }
.summary-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.summary-grid div { padding: 10px 4px; border: 1px solid var(--line); border-radius: 12px; background: rgba(0,0,0,0.15); }
.summary-grid strong { display: block; font-size: 16px; }
.summary-grid span { font-size: 10px; color: var(--mut); }
.empty { color: var(--mut); text-align: center; padding: 12px; font-size: 13px; }

footer { text-align: center; color: var(--mut); font-size: 11px; margin-top: 8px; display: flex; flex-direction: column; gap: 3px; line-height: 1.4; }
footer strong { color: var(--fg); font-weight: 750; }
.report-bug-btn {
  margin-top: 6px; background: transparent; border: 1px solid var(--line); border-radius: 20px;
  padding: 6px 14px; font-size: 11px; font-weight: 700; color: var(--mut); cursor: pointer;
}
.report-bug-btn:hover { background: var(--soft); color: var(--fg); }

.search-modal {
  position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.6); backdrop-filter: blur(8px);
  display: flex; align-items: flex-start; justify-content: center; padding: 60px 12px 20px;
}
.search-modal[hidden] { display: none; }
.search-panel { background: var(--card); backdrop-filter: var(--blur); border-radius: 22px; width: 100%; max-width: 480px; max-height: 70vh; display: flex; flex-direction: column; border: 1px solid var(--line); }
.search-head { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); align-items: center; }
.search-head input { flex: 1; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 15px; background: rgba(0,0,0,0.2); color: var(--fg); outline: none; }
.search-results { overflow-y: auto; padding: 8px 12px 16px; flex: 1; }
.search-item { padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 8px; cursor: pointer; }
.search-item:hover { background: rgba(255,255,255,0.1); }
.search-item .nl { font-weight: 800; font-size: 16px; margin-bottom: 2px; }
.search-item .tr { color: var(--mut); font-size: 13px; }
.search-item .ex { font-size: 12px; margin-top: 4px; color: var(--fg); opacity: .8; }
.search-empty { text-align: center; color: var(--mut); padding: 24px 8px; font-size: 14px; }

.q h2.sm { font-size: 18px; letter-spacing: -.02em; }
.slots, .bank { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; direction: ltr; }
.bank { min-height: 40px; }
.sw2 { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.sw2.rQ { --rc: var(--acc); } .sw2.rV { --rc: var(--ok); } .sw2.rS { --rc: var(--amb); } .sw2.rR { --rc: var(--mut); }
.role { font-size: 9px; letter-spacing: .05em; text-transform: uppercase; font-weight: 800; color: var(--rc); }
.slot {
  min-width: 54px; min-height: 38px; padding: 4px 6px; border-radius: 8px; border: 1px dashed var(--line);
  border-bottom: 3px solid var(--rc); background: rgba(0,0,0,0.2); color: var(--fg); font: inherit; font-weight: 600; font-size: 13px; cursor: pointer;
}
.slot.filled { border-style: solid; background: var(--card); }
.slot.bad { border-color: var(--bad); border-bottom-color: var(--bad); color: var(--bad); background: var(--bad-bg); animation: shake .3s; }
.slot.good { border-color: var(--ok); border-bottom-color: var(--ok); color: var(--ok); background: var(--ok-bg); }
.tile { min-height: 36px; padding: 6px 9px; font-size: 13.5px; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

@media(max-width:480px){
  main { padding: 8px 8px 18px; gap: 8px; }
  header { padding: 8px 10px; }
  .brand h1 { font-size: 16px; }
  .top-right { width: 100%; justify-content: space-between; margin-top: 2px; }
  .nav-section { padding: 8px; gap: 8px; border-radius: 16px; }
  .nav-cats button, .nav-subs button { padding: 6px 10px; font-size: 12px; }
  .modes-wrapper button { padding: 6px 2px; font-size: 11px; }
  .card { padding: 12px 10px; gap: 10px; border-radius: 16px; }
  .opt { font-size: 13px; padding: 8px 4px; min-height: 44px; }
}
</style>
</head>

let state={
  targetLang:"nl",
  uiLang:"uk",
  theme:"dark",
  cat:"comm",
  tab:"phrases",
  mode:"quiz",
  score:0,
  idx:0,
  items:[],
  learned:new Set(),
  review:new Set(),
  correctInRound:0
};

function saveState(){
  try{
    localStorage.setItem("leren_state",JSON.stringify({
      targetLang:state.targetLang,
      uiLang:state.uiLang,
      theme:state.theme,
      cat:state.cat,
      tab:state.tab,
      mode:state.mode,
      score:state.score,
      learned:Array.from(state.learned),
      review:Array.from(state.review)
    }));
  }catch(e){}
}

function loadState(){
  try{
    const s=localStorage.getItem("leren_state");
    if(s){
      const parsed=JSON.parse(s);
      if(parsed.targetLang) state.targetLang=parsed.targetLang;
      if(parsed.uiLang) state.uiLang=parsed.uiLang;
      if(parsed.theme) state.theme=parsed.theme;
      if(parsed.cat) state.cat=parsed.cat;
      if(parsed.tab) state.tab=parsed.tab;
      if(parsed.mode) state.mode=parsed.mode;
      if(typeof parsed.score==='number') state.score=parsed.score;
      if(Array.isArray(parsed.learned)) state.learned=new Set(parsed.learned);
      if(Array.isArray(parsed.review)) state.review=new Set(parsed.review);
    }
  }catch(e){}
}

function speak(text, lang="nl-BE"){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang;
  u.rate=0.85;
  window.speechSynthesis.speak(u);
}

function t(key){
  const dict=UI[state.uiLang]||UI.uk;
  return dict[key]||key;
}

function initUI(){
  document.documentElement.setAttribute("data-theme", state.theme);
  $("themeToggle").textContent=state.theme==="dark"?"🌙":"☀️";
  $("targetLangPicker").value=state.targetLang;
  $("uiLangPicker").value=state.uiLang;

  $("tagline").textContent=t("tagline");
  $("targetLabel").textContent=t("target");
  $("uiLabel").textContent=t("ui");
  $("lblCat").textContent=t("lCat");
  $("lblSub").textContent=t("lSub");
  $("lblMode").textContent=t("lMode");
  $("reportBugBtn").textContent=t("reportBug");
  $("footText").textContent=t("footer");

  renderCats();
  renderSubs();
  renderModes();
  updateStats();
}

function renderCats(){
  const nav=$("catNav");
  nav.innerHTML="";
  CATEGORIES.forEach(c=>{
    const btn=document.createElement("button");
    btn.type="button";
    btn.textContent=(UI[state.uiLang]?.cats?.[c.id])||c.id;
    btn.setAttribute("aria-selected", c.id===state.cat?"true":"false");
    btn.onclick=()=>{
      state.cat=c.id;
      state.tab=c.tabs[0];
      renderCats();
      renderSubs();
      startRound();
      saveState();
    };
    nav.appendChild(btn);
  });
}

function renderSubs(){
  const nav=$("subNav");
  nav.innerHTML="";
  const catObj=CATEGORIES.find(c=>c.id===state.cat);
  if(!catObj) return;

  catObj.tabs.forEach(tabKey=>{
    const btn=document.createElement("button");
    btn.type="button";
    btn.textContent=(UI[state.uiLang]?.tabs?.[tabKey])||tabKey;
    btn.setAttribute("aria-selected", tabKey===state.tab?"true":"false");
    btn.onclick=()=>{
      state.tab=tabKey;
      renderSubs();
      startRound();
      saveState();
    };
    nav.appendChild(btn);
  });
}

function renderModes(){
  const wrapper=$("modeButtons");
  wrapper.innerHTML="";
  const modes=["study","quiz","audio","review"];
  modes.forEach(m=>{
    const btn=document.createElement("button");
    btn.type="button";
    btn.textContent=(UI[state.uiLang]?.modes?.[m])||m;
    if(m===state.mode) btn.className="primary";
    btn.onclick=()=>{
      state.mode=m;
      renderModes();
      startRound();
      saveState();
    };
    wrapper.appendChild(btn);
  });
}

function updateStats(){
  $("score").textContent="⭐ "+state.score;
  $("learnedCount").textContent=state.learned.size;
  $("reviewCount").textContent=t("review")+": "+state.review.size;
}

function startRound(){
  state.idx=0;
  state.correctInRound=0;

  if(state.mode==="review"){
    const allItems=[];
    Object.values(DATA).forEach(group=>{
      if(group && group.items) allItems.push(...group.items);
    });
    state.items=allItems.filter(i=>state.review.has(i.id));
    if(state.items.length===0){
      renderEmptyReview();
      return;
    }
  } else {
    const group=DATA[state.tab];
    if(!group || !group.items || group.items.length===0){
      renderEmptyTopic();
      return;
    }
    state.items=[...group.items].sort(()=>Math.random()-0.5).slice(0, PER_ROUND);
  }

  renderCard();
}

function renderEmptyReview(){
  $("card").innerHTML=`<div class="empty"><p>${t("emptyReview")}</p></div>`;
  $("prog").textContent="";
  $("rnd").textContent="";
  $("barfill").style.width="0%";
}

function renderEmptyTopic(){
  $("card").innerHTML=`<div class="empty"><p>${t("noItems")}</p></div>`;
  $("prog").textContent="";
  $("rnd").textContent="";
  $("barfill").style.width="0%";
}

function renderCard(){
  if(state.idx>=state.items.length){
    renderEndRound();
    return;
  }

  const item=state.items[state.idx];
  const total=state.items.length;
  const pct=Math.round(((state.idx)/total)*100);

  $("prog").textContent=`${t("lessonProgress")} ${state.idx+1} / ${total}`;
  $("rnd").textContent=`${t("round")} 1`;
  $("barfill").style.width=`${pct}%`;

  const card=$("card");
  card.innerHTML="";

  if(state.mode==="study"){
    renderStudyCard(card, item);
  } else if(state.mode==="audio"){
    renderAudioCard(card, item);
  } else {
    renderQuizCard(card, item);
  }
}

function renderStudyCard(card, item){
  const textNL=item.nl||"";
  const textTr=item[state.uiLang]||item.en||"";

  card.innerHTML=`
    <div class="q">
      <small>${t("studySub")}</small>
      <div class="icon-box">${item.icon||"💡"}</div>
      <h2>${textNL}</h2>
      <p>${textTr}</p>
      <button class="listen" type="button" id="speakBtn">${t("listen")}</button>
    </div>
    ${item.ex_nl ? `<div class="feedback"><p class="example">" ${item.ex_nl} "</p><p>${item.ex_uk||""}</p></div>` : ""}
    <div class="row" style="margin-top:10px;">
      <button class="btn primary" type="button" id="nextBtn">${t("next")}</button>
    </div>
  `;

  $("speakBtn").onclick=()=>speak(textNL);
  $("nextBtn").onclick=()=>{
    state.learned.add(item.id);
    state.score+=1;
    updateStats();
    saveState();
    state.idx++;
    renderCard();
  };
}

function renderQuizCard(card, item){
  const textNL=item.nl||"";
  const textTr=item[state.uiLang]||item.en||"";

  let options=[item];
  const allInGroup=(DATA[state.tab]?.items||[]);
  const candidates=allInGroup.filter(i=>i.id!==item.id);
  const shuffled=candidates.sort(()=>Math.random()-0.5).slice(0, 3);
  options.push(...shuffled);
  options.sort(()=>Math.random()-0.5);

  card.innerHTML=`
    <div class="q">
      <small>${UI[state.uiLang]?.subs?.[state.tab]||t("quiz")}</small>
      <div class="icon-box">${item.icon||"❓"}</div>
      <h2>${textTr}</h2>
      <button class="listen" type="button" id="speakBtn">${t("listen")}</button>
    </div>
    <div class="opts" id="optsBox"></div>
    <div class="feedback" id="feedbackBox"></div>
    <div class="row" id="actionRow" hidden>
      <button class="btn primary" type="button" id="nextBtn">${t("next")}</button>
    </div>
  `;

  $("speakBtn").onclick=()=>speak(textNL);

  const optsBox=$("optsBox");
  options.forEach(optItem=>{
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="opt";
    btn.textContent=optItem.nl;
    btn.onclick=()=>checkAnswer(optItem, item, btn);
    optsBox.appendChild(btn);
  });
}

  const textNL=item.nl||"";

  let options=[item];
  const allInGroup=(DATA[state.tab]?.items||[]);
  const candidates=allInGroup.filter(i=>i.id!==item.id);
  const shuffled=candidates.sort(()=>Math.random()-0.5).slice(0, 3);
  options.push(...shuffled);
  options.sort(()=>Math.random()-0.5);

  card.innerHTML=`
    <div class="q">
      <small>${t("audioSub")}</small>
      <div class="icon-box">🎧</div>
      <h2>???</h2>
      <button class="listen" type="button" id="speakBtn">${t("listen")}</button>
    </div>
    <div class="opts" id="optsBox"></div>
    <div class="feedback" id="feedbackBox"></div>
    <div class="row" id="actionRow" hidden>
      <button class="btn primary" type="button" id="nextBtn">${t("next")}</button>
    </div>
  `;

  speak(textNL);
  $("speakBtn").onclick=()=>speak(textNL);

  const optsBox=$("optsBox");
  options.forEach(optItem=>{
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="opt";
    btn.textContent=optItem[state.uiLang]||optItem.en;
    btn.onclick=()=>checkAnswer(optItem, item, btn);
    optsBox.appendChild(btn);
  });
}

function checkAnswer(selected, correct, btnEl){
  const opts=document.querySelectorAll(".opt");
  opts.forEach(b=>b.disabled=true);

  const fb=$("feedbackBox");
  const isCorrect=selected.id===correct.id;

  if(isCorrect){
    btnEl.classList.add("correct");
    fb.innerHTML=`<strong>${t("correct")}</strong>`;
    state.score+=5;
    state.correctInRound++;
    state.learned.add(correct.id);
    state.review.delete(correct.id);
  } else {
    btnEl.classList.add("incorrect");
    opts.forEach(b=>{
      if(b.textContent===correct.nl || b.textContent===(correct[state.uiLang]||correct.en)){
        b.classList.add("correct");
      }
    });
    fb.innerHTML=`<strong>${t("incorrect")} ${correct.nl}</strong><p>${correct[state.uiLang]||correct.en}</p>`;
    state.review.add(correct.id);
  }

  speak(correct.nl);
  updateStats();
  saveState();

  $("actionRow").hidden=false;
  $("nextBtn").onclick=()=>{
    state.idx++;
    renderCard();
  };
}

function renderEndRound(){
  const total=state.items.length;
  const pct=total>0?Math.round((state.correctInRound/total)*100):0;

  $("barfill").style.width="100%";
  $("prog").textContent=t("finished");

  $("card").innerHTML=`
    <div class="end">
      <h2>🎉 ${t("finished")}</h2>
      <p>${t("accuracy")}: <strong>${pct}%</strong></p>
      <div class="summary-grid">
        <div><strong>${state.correctInRound}</strong><span>${t("right")}</span></div>
        <div><strong>${total - state.correctInRound}</strong><span>${t("review")}</span></div>
        <div><strong>+${state.correctInRound * 5}</strong><span>${t("points")}</span></div>
      </div>
      <div class="row" style="margin-top:10px;">
        <button class="btn" type="button" id="againBtn">${t("again")}</button>
        <button class="btn primary" type="button" id="nextTopicBtn">${t("nextTopic")}</button>
      </div>
    </div>
  `;

  $("againBtn").onclick=()=>startRound();
  $("nextTopicBtn").onclick=()=>{
    const catObj=CATEGORIES.find(c=>c.id===state.cat);
    if(catObj){
      const currIdx=catObj.tabs.indexOf(state.tab);
      if(currIdx>=0 && currIdx<catObj.tabs.length-1){
        state.tab=catObj.tabs[currIdx+1];
      } else {
        const catIdx=CATEGORIES.findIndex(c=>c.id===state.cat);
        const nextCat=CATEGORIES[(catIdx+1)%CATEGORIES.length];
        state.cat=nextCat.id;
        state.tab=nextCat.tabs[0];
      }
      renderCats();
      renderSubs();
      startRound();
      saveState();
    }
  };
}

function setupSearch(){
  const modal=$("searchModal");
  const input=$("searchInput");
  const results=$("searchResults");

  $("searchBtn").onclick=()=>{
    modal.hidden=false;
    input.value="";
    results.innerHTML="";
    input.focus();
  };

  $("searchClose").onclick=()=>modal.hidden=true;

  input.oninput=()=>{
    const q=input.value.trim().toLowerCase();
    if(!q){ results.innerHTML=""; return; }

    const matches=[];
    Object.values(DATA).forEach(group=>{
      if(!group || !group.items) return;
      group.items.forEach(item=>{
        if((item.nl && item.nl.toLowerCase().includes(q)) ||
           (item.uk && item.uk.toLowerCase().includes(q)) ||
           (item.en && item.en.toLowerCase().includes(q))){
          matches.push(item);
        }
      });
    });

    if(matches.length===0){
      results.innerHTML=`<div class="search-empty">${t("searchEmpty")}</div>`;
      return;
    }

    results.innerHTML="";
    matches.slice(0, 15).forEach(m=>{
      const div=document.createElement("div");
      div.className="search-item";
      div.innerHTML=`
        <div class="nl">${m.icon||""} ${m.nl}</div>
        <div class="tr">${m[state.uiLang]||m.en||""}</div>
        ${m.ex_nl ? `<div class="ex">" ${m.ex_nl} "</div>` : ""}
      `;
      div.onclick=()=>{
        speak(m.nl);
      };
      results.appendChild(div);
    });
  };
}

function initEvents(){
  $("themeToggle").onclick=()=>{
    state.theme=state.theme==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme", state.theme);
    $("themeToggle").textContent=state.theme==="dark"?"🌙":"☀️";
    saveState();
  };

  $("targetLangPicker").onchange=e=>{
    state.targetLang=e.target.value;
    saveState();
  };

  $("uiLangPicker").onchange=e=>{
    state.uiLang=e.target.value;
    initUI();
    startRound();
    saveState();
  };

  $("reportBugBtn").onclick=()=>{
    window.location.href="mailto:gembarsky.d@gmail.com?subject=Leren.be%20Bug%20Report";
  };

  setupSearch();
}

function start(){
  loadState();
  initUI();
  initEvents();
  startRound();
}

document.addEventListener("DOMContentLoaded", start);
</script>
</body>
