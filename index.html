<!DOCTYPE html>
<html lang="uk" data-theme="glass">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leren.be">
<meta name="application-name" content="Leren.be">
<meta name="description" content="Вивчення нідерландської мови A1.1 з вправами, тестами та повторенням.">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>Leren.be — Nederlands A1.1</title>
<style>
:root{color-scheme:light;--bg:#F2F4F8;--fg:#1E2238;--mut:#656C85;--card:#FFFFFF;--line:#E2E6F0;--acc:#4657D9;--acc-hover:#3545c4;--ok:#1F8A53;--ok-bg:#EBF7F0;--bad:#D93D4A;--bad-bg:#FDF0F1;--soft:#EBF0FF;--shadow:0 4px 20px rgba(30,34,56,.05);--amb:#B7791F}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0F111A;--fg:#F0F2FA;--mut:#98A0B8;--card:#1A1D2A;--line:#2A2E40;--acc:#7B8BFF;--acc-hover:#93A0FF;--ok:#50D086;--ok-bg:#163324;--bad:#FF737C;--bad-bg:#381C23;--soft:#232845;--shadow:0 4px 20px rgba(0,0,0,.25);--amb:#E5B567}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,select{font:inherit}
button:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{touch-action:manipulation}
main{width:100%;max-width:720px;margin:0 auto;padding:12px 12px 24px;display:flex;flex-direction:column;gap:12px}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--card);padding:10px 14px;border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow)}
.brand h1{font-size:18px;line-height:1.1;margin:0;letter-spacing:-.03em;font-weight:800}
.brand p{margin:2px 0 0;color:var(--mut);font-size:11px}
.top-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.select-group{display:flex;align-items:center;gap:3px;color:var(--mut);font-size:11px}
.lang-select,.theme-btn{background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:8px;min-height:32px;padding:3px 6px;font-size:12px;font-weight:600;box-shadow:0 2px 5px rgba(0,0,0,.03)}
.theme-btn{cursor:pointer;min-width:34px;text-align:center}
.score-pill{border:1px solid var(--line);background:var(--soft);color:var(--acc);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:800;white-space:nowrap;box-shadow:0 2px 5px rgba(0,0,0,.03)}

/* Статистика */
.stats-bar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12px;color:var(--mut);box-shadow:0 2px 8px rgba(0,0,0,.02)}
.stats-bar strong{color:var(--fg);font-weight:700}

/* Навігація */
.nav-section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.section-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:800;margin-bottom:-4px;padding-left:2px}

/* 1 Рівень: Розділи */
.nav-cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--pop) transparent;padding:4px 2px 8px;scroll-snap-type:x proximity}
.nav-cats::-webkit-scrollbar{height:5px;display:block}
.nav-cats::-webkit-scrollbar-thumb{background:var(--pop);border-radius:4px}
.nav-cats::-webkit-scrollbar-track{background:rgba(0,0,0,.06);border-radius:4px}
.nav-fade-wrap{position:relative}
.nav-fade-wrap::after{content:"";position:absolute;right:0;top:0;bottom:8px;width:28px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--card));border-radius:0 14px 14px 0}
.nav-cats button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--mut);cursor:pointer;white-space:nowrap;flex-shrink:0;font-size:13px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.04);transition:all .15s}
.nav-cats button[aria-selected="true"]{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 4px 12px rgba(70,87,217,.35)}

/* 2 Рівень: Підрозділи */
.sub-wrapper{background:var(--bg);border-radius:10px;padding:6px;border:1px solid var(--line)}
.nav-subs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.nav-subs::-webkit-scrollbar{display:none}
.nav-subs button{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 10px;color:var(--mut);cursor:pointer;white-space:nowrap;flex-shrink:0;font-size:12px;font-weight:600;box-shadow:0 2px 4px rgba(0,0,0,.03);transition:all .15s}
.nav-subs button[aria-selected="true"]{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 3px 8px rgba(70,87,217,.3);font-weight:750}

/* 3 Рівень: Режими гри */
.modes-wrapper{background:var(--line);border-radius:10px;padding:4px;display:flex;gap:6px}
.modes-wrapper button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:7px 4px;color:var(--mut);font-size:12px;font-weight:700;cursor:pointer;text-align:center;white-space:nowrap;box-shadow:0 2px 5px rgba(0,0,0,.04);transition:all .15s}
.modes-wrapper button.primary{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 3px 10px rgba(70,87,217,.35)}

.meta{display:flex;justify-content:space-between;gap:8px;color:var(--mut);font-size:11px;font-weight:600;padding:0 2px}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}

/* Картка */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.q{text-align:center}
.q small{color:var(--mut);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:800}
.icon-box{font-size:42px;margin:4px 0 0;line-height:1}
.q h2{font-size:clamp(20px,4.5vw,28px);font-weight:800;margin:4px 0 2px;letter-spacing:-.03em;overflow-wrap:anywhere}
.q p{margin:0;color:var(--mut);font-size:13px}
.listen{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:18px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;margin-top:6px;min-height:34px;box-shadow:0 2px 5px rgba(0,0,0,.04)}
.listen:hover,.btn:hover,.opt:hover:not(:disabled){border-color:var(--acc)}

/* Циферблат годинника */
.clock-visual{width:110px;height:110px;border-radius:50%;background:var(--bg);border:3px solid var(--acc);margin:8px auto 2px;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 8px rgba(0,0,0,.08), 0 4px 10px rgba(0,0,0,.05)}
.clock-center{width:8px;height:8px;background:var(--acc);border-radius:50%;position:absolute;z-index:3}
.clock-hand-h{width:3px;height:32px;background:var(--fg);position:absolute;bottom:55px;left:53.5px;border-radius:2px;transform-origin:bottom center;z-index:2}
.clock-hand-m{width:2px;height:44px;background:var(--acc);position:absolute;bottom:55px;left:54px;border-radius:2px;transform-origin:bottom center;z-index:1}

/* Варіанти відповідей */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:10px 8px;font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:46px;overflow-wrap:anywhere;box-shadow:0 3px 8px rgba(0,0,0,.04);transition:transform .1s, box-shadow .1s}
.opt:active{transform:scale(.985);box-shadow:0 1px 3px rgba(0,0,0,.04)}

@keyframes rgbGlow {
  0%   { border-color: #ff0055; box-shadow: 0 0 10px #ff0055; }
  25%  { border-color: #00e5ff; box-shadow: 0 0 10px #00e5ff; }
  50%  { border-color: #00ff66; box-shadow: 0 0 10px #00ff66; }
  75%  { border-color: #ffcc00; box-shadow: 0 0 10px #ffcc00; }
  100% { border-color: #ff0055; box-shadow: 0 0 10px #ff0055; }
}

.opt.correct {
  animation: rgbGlow 1.5s linear infinite;
  background: var(--ok-bg) !important;
  color: var(--fg) !important;
  font-weight: 700;
  border-width: 2px !important;
}

.opt.incorrect{border-color:var(--bad);color:var(--bad);background:var(--bad-bg);box-shadow:0 3px 10px rgba(217,61,74,.15)}
.opt:disabled{cursor:default}
.swatch{width:12px;height:12px;border-radius:50%;border:1px solid var(--line);flex-shrink:0}

.feedback{border-radius:10px;padding:8px 10px;text-align:center;background:var(--bg);border:1px solid var(--line)}
.feedback:empty{display:none}
.feedback strong{display:block;font-size:14px}
.feedback p{margin:2px 0 0;color:var(--mut);font-size:12px}
.feedback .example{margin-top:4px;color:var(--fg);font-weight:600}

.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:100px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-weight:700;cursor:pointer;text-align:center;min-height:40px;font-size:13px;box-shadow:0 3px 8px rgba(0,0,0,.04)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 4px 12px rgba(70,87,217,.3)}
.btn.primary:hover{background:var(--acc-hover)}

.end{text-align:center;display:flex;flex-direction:column;gap:10px}
.end h2{font-size:32px;margin:0;letter-spacing:-.04em}
.end p{color:var(--mut);margin:0}
.summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.summary-grid div{padding:8px 4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);box-shadow:0 2px 5px rgba(0,0,0,.02)}
.summary-grid strong{display:block;font-size:16px}
.summary-grid span{font-size:10px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:10px;font-size:13px}

footer{text-align:center;color:var(--mut);font-size:11px;margin-top:8px;display:flex;flex-direction:column;gap:3px;line-height:1.4}
footer strong{color:var(--fg);font-weight:750}
.report-bug-btn{margin-top:6px;background:transparent;border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:11px;font-weight:700;color:var(--mut);cursor:pointer;transition:all .15s}
.report-bug-btn:hover{background:var(--soft);color:var(--fg);border-color:var(--acc)}
.search-modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:60px 12px 20px}
.search-modal[hidden]{display:none}
.search-panel{background:var(--card);border-radius:18px;width:100%;max-width:480px;max-height:70vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.25);border:2px solid var(--line)}
.search-head{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line);align-items:center}
.search-head input{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px;background:var(--bg);color:var(--fg);outline:none}
.search-head input:focus{border-color:var(--acc)}
.search-results{overflow-y:auto;padding:8px 12px 16px;flex:1}
.search-item{padding:10px 12px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;cursor:default}
.search-item .nl{font-weight:800;font-size:16px;margin-bottom:2px}
.search-item .tr{color:var(--mut);font-size:13px}
.search-item .ex{font-size:12px;margin-top:4px;color:var(--fg);opacity:.8}
.search-empty{text-align:center;color:var(--mut);padding:24px 8px;font-size:14px}

.q h2.sm{font-size:18px;letter-spacing:-.02em}
.slots,.bank{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;direction:ltr}
.bank{min-height:40px}
.sw2{display:flex;flex-direction:column;align-items:center;gap:2px}
.sw2.rQ{--rc:var(--acc)}.sw2.rV{--rc:var(--ok)}.sw2.rS{--rc:var(--amb)}.sw2.rR{--rc:var(--mut)}
.role{font-size:9px;letter-spacing:.05em;text-transform:uppercase;font-weight:800;color:var(--rc)}
.slot{min-width:54px;min-height:38px;padding:4px 6px;border-radius:8px;border:1px dashed var(--line);border-bottom:3px solid var(--rc);background:var(--bg);color:var(--fg);font:inherit;font-weight:600;font-size:13px;cursor:pointer;box-shadow:inset 0 1px 3px rgba(0,0,0,.04)}
.slot.filled{border-style:solid;background:var(--card);box-shadow:0 2px 5px rgba(0,0,0,.05)}
.slot.bad{border-color:var(--bad);border-bottom-color:var(--bad);color:var(--bad);background:var(--bad-bg);animation:shake .3s}
.slot.good{border-color:var(--ok);border-bottom-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.tile{min-height:36px;padding:6px 9px;font-size:13.5px;box-shadow:0 3px 6px rgba(0,0,0,.05)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

@media(max-width:480px){
 main{padding:8px 8px 18px;gap:8px}
 header{padding:8px 10px}
 .brand h1{font-size:16px}
 .top-right{width:100%;justify-content:space-between;margin-top:2px}
 .nav-section{padding:8px;gap:8px;border-radius:14px}
 .nav-cats button{padding:7px 10px;font-size:12px}
 .nav-subs button{padding:5px 8px;font-size:11.5px}
 .modes-wrapper button{padding:6px 2px;font-size:11px}
 .card{padding:12px 10px;gap:10px;border-radius:14px}
 .opt{font-size:13px;padding:8px 4px;min-height:42px}
}
</style>
<style id="theme-oranje">
.select-group>span{display:none}
.top-right{flex-wrap:nowrap;gap:6px}.select-group{flex:1 1 0;min-width:0}.lang-select{width:auto;min-width:64px;max-width:90px;padding:3px 4px;font-size:12px!important;text-align:center}.score-pill{flex:0 0 auto}.theme-btn{flex:0 0 auto}
.lang-select,.theme-btn{min-height:40px;font-size:13px}
.nav-cats button,.nav-subs button,.modes-wrapper button{min-height:40px}
.opt{min-height:54px;font-size:15px}.btn{min-height:48px;font-size:15px}.icon-box{font-size:58px}

/* Default = Glass (first theme) */
:root, :root[data-theme="glass"]{
  color-scheme:dark;
  --bg:#1a0b3a;
  --fg:#F4F7FF;
  --mut:#B8C4E8;
  --card:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.22);
  --acc:#7DD3FC;
  --acc-hover:#A5E4FF;
  --ok:#4ADE80;
  --ok-bg:rgba(74,222,128,.18);
  --bad:#FB7185;
  --bad-bg:rgba(251,113,133,.18);
  --soft:rgba(255,255,255,.10);
  --shadow:0 8px 32px rgba(0,0,0,.25);
  --amb:#FBBF24;
  --pop:#F59E0B;
  --hdr:rgba(255,255,255,.14);
}
:root[data-theme="oranje"]{
  color-scheme:light;
  --bg:#FFF3E0;--fg:#2A1A0C;--mut:#7A5A3A;--card:#FFFFFF;--line:#F3D3A8;
  --acc:#C94600;--acc-hover:#A93A00;--ok:#1E8E4E;--ok-bg:#DFF5E6;
  --bad:#D32F2F;--bad-bg:#FFE3E0;--soft:#FFE2B8;
  --shadow:0 4px 0 rgba(120,70,10,.12);--amb:#B26A00;--pop:#FF8A1F;--hdr:#FFD23F;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1D130C;--fg:#FFF1E0;--mut:#D9B38A;--card:#2C1D12;--line:#4D3420;
  --acc:#FFA64D;--acc-hover:#FFB871;--ok:#5BE08F;--ok-bg:#163A25;
  --bad:#FF8480;--bad-bg:#40201F;--soft:#4A3015;
  --shadow:0 4px 0 rgba(0,0,0,.35);--pop:#FFA64D;--hdr:#2a1a0c;
}
/* Glass theme atmosphere */
:root[data-theme="glass"] body,
:root:not([data-theme]) body{
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(167,139,250,.55), transparent 55%),
    radial-gradient(900px 500px at 100% 20%, rgba(56,189,248,.45), transparent 50%),
    radial-gradient(800px 500px at 50% 100%, rgba(236,72,153,.35), transparent 55%),
    linear-gradient(160deg, #1a0b3a 0%, #2e1065 40%, #0c4a6e 100%);
  background-attachment: fixed;
  color: var(--fg);
}
:root[data-theme="glass"] header,
:root:not([data-theme]) header{
  background: rgba(255,255,255,.14) !important;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,.22) !important;
  box-shadow: 0 8px 32px rgba(0,0,0,.2) !important;
}
:root[data-theme="glass"] .brand h1,
:root:not([data-theme]) .brand h1{
  color: #fff !important;
  text-shadow: 0 2px 12px rgba(0,0,0,.35);
}
:root[data-theme="glass"] .brand p,
:root:not([data-theme]) .brand p{
  color: rgba(255,255,255,.85) !important;
}
:root[data-theme="glass"] .stats-bar,
:root[data-theme="glass"] .nav-section,
:root[data-theme="glass"] .card,
:root:not([data-theme]) .stats-bar,
:root:not([data-theme]) .nav-section,
:root:not([data-theme]) .card{
  background: rgba(255,255,255,.12) !important;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,.2) !important;
  box-shadow: 0 8px 28px rgba(0,0,0,.18) !important;
}
:root[data-theme="glass"] .nav-cats button,
:root[data-theme="glass"] .nav-subs button,
:root[data-theme="glass"] .opt,
:root[data-theme="glass"] .btn:not(.primary),
:root[data-theme="glass"] .listen,
:root[data-theme="glass"] .lang-select,
:root[data-theme="glass"] .theme-btn,
:root[data-theme="glass"] .score-pill,
:root:not([data-theme]) .nav-cats button,
:root:not([data-theme]) .nav-subs button,
:root:not([data-theme]) .opt,
:root:not([data-theme]) .btn:not(.primary),
:root:not([data-theme]) .listen,
:root:not([data-theme]) .lang-select,
:root:not([data-theme]) .theme-btn,
:root:not([data-theme]) .score-pill{
  background: rgba(255,255,255,.14) !important;
  color: var(--fg) !important;
  border-color: rgba(255,255,255,.22) !important;
  box-shadow: none !important;
}
:root[data-theme="glass"] .opt.correct,
:root:not([data-theme]) .opt.correct{
  background: rgba(74,222,128,.30) !important;
  border-color: #4ADE80 !important;
  color: #fff !important;
}
:root[data-theme="glass"] .opt.incorrect,
:root:not([data-theme]) .opt.incorrect{
  background: rgba(251,113,133,.30) !important;
  border-color: #FB7185 !important;
  color: #fff !important;
}
:root[data-theme="glass"] .nav-cats button[aria-selected="true"],
:root[data-theme="glass"] .nav-subs button[aria-selected="true"],
:root:not([data-theme]) .nav-cats button[aria-selected="true"],
:root:not([data-theme]) .nav-subs button[aria-selected="true"]{
  background: rgba(125,211,252,.35) !important;
  border-color: rgba(125,211,252,.6) !important;
  color: #fff !important;
}
:root[data-theme="glass"] .btn.primary,
:root[data-theme="glass"] .modes-wrapper button.primary,
:root:not([data-theme]) .btn.primary,
:root:not([data-theme]) .modes-wrapper button.primary{
  background: linear-gradient(90deg, #F59E0B, #FBBF24) !important;
  border-color: #D97706 !important;
  color: #1c1005 !important;
}
:root[data-theme="glass"] .modes-wrapper,
:root:not([data-theme]) .modes-wrapper{
  background: rgba(255,255,255,.14) !important;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,.25) !important;
  box-shadow: 0 8px 28px rgba(0,0,0,.3) !important;
}
:root[data-theme="glass"] footer,
:root:not([data-theme]) footer{color: rgba(255,255,255,.7)}
:root[data-theme="glass"] .report-bug-btn,
:root:not([data-theme]) .report-bug-btn{
  background: rgba(255,255,255,.1);
  border-color: rgba(255,255,255,.25);
  color: rgba(255,255,255,.85);
}
:root[data-theme="glass"] .bar,
:root:not([data-theme]) .bar{background: rgba(255,255,255,.15)}
:root[data-theme="glass"] .bar i,
:root:not([data-theme]) .bar i{background: linear-gradient(90deg,#7DD3FC,#A78BFA)}
:root[data-theme="glass"] .nav-fade-wrap::after,

<main>

    <div class="top-right">
      <label class="select-group"><span id="targetLabel"></span>
        <select id="targetLangPicker" class="lang-select" aria-label="Target language">
          <option value="nl">🇧🇪 BE</option><option value="en">🇬🇧 ENG</option><option value="fr">🇫🇷 FRA</option>

      <label class="select-group"><span id="uiLabel"></span>

      <button class="theme-btn" id="searchBtn" type="button" title="Search">🔍</button>
      <span id="score" class="score-pill" aria-live="polite">⭐ 0</span>
      <button class="theme-btn" id="themeToggle" type="button">🌙</button>

  <div class="stats-bar">
    <span><span id="progressLabel"></span>: <strong id="learnedCount">0</strong></span>
    <span id="reviewCount"></span>

    <div class="section-label" id="lblCat">Розділ</div>

    <div class="section-label" id="lblSub">Підрозділ</div>

      <nav class="nav-subs" id="subNav" aria-label="Subtopics"></nav>
    </div>

    <div class="section-label" id="lblMode">Режим</div>

  <section class="card" id="card" aria-live="polite"></section>
  
  <footer>
    <span id="footText"></span>
    <span>Danylo Hembarskyi • All rights reserved</span>
    <span><a href="mailto:gembarsky.d@gmail.com" style="color:inherit;text-decoration:none">gembarsky.d@gmail.com</a> · <a href="./privacy.html" style="color:inherit">Privacy</a></span>

    </div>
  </footer>
</main>

</div>

function say(text){
 try{
  if(!("speechSynthesis" in window)||!("SpeechSynthesisUtterance" in window)){showSpeechNote();return}
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang={nl:"nl-BE",en:"en-GB",fr:"fr-BE"}[targetLang]||"nl-BE";u.rate=.86;
  const voices=window.speechSynthesis.getVoices(),pre=u.lang.toLowerCase().split("-")[0];
  const v=voices.find(x=>x.lang.toLowerCase()===u.lang.toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(pre));
  if(v)u.voice=v;
  u.onerror=e=>{if(!["interrupted","canceled","not-allowed"].includes(e.error))showSpeechNote()};
  window.speechSynthesis.speak(u);
 }catch(e){showSpeechNote()}
}

 let list=itemsFor();
 if(mode==="review"){const ids=new Set(list.map(x=>x.id));list=dueItems().filter(x=>ids.has(x.id))}
 if(!list.length){renderEmpty();return}
 deck=shuffle(list).slice(0,PER_ROUND);roundTotal=deck.length;
 nextQuestion();
}

  return shuffle(arts.map(l=>({label:l,ok:l===artOf(cur),t:true})));
 }
 const f=mode==="audio"?meaningFor:labelFor,g=mode==="audio"?labelFor:meaningFor,t=mode!=="audio",correct=f(cur),seen=new Set([correct]),out=[];
 // Skip distractors that would also be a correct answer (same prompt text)
 for(const x of shuffle(itemsFor().filter(x=>x.id!==cur.id&&g(x)!==g(cur)))){
  const v=f(x);
  if(!seen.has(v)){seen.add(v);out.push({label:v,ok:false,c:x.c,t});if(out.length>=3)break}
 }
 out.push({label:correct,ok:true,c:cur.c,t});
 return shuffle(out);
}

function renderClockFace(nlText){
 const wrap=el("div","clock-visual");
 wrap.appendChild(el("div","clock-center"));
 let hAngle=0, mAngle=0;
 const t = String(nlText).toLowerCase();
 if(t.includes("twaalf uur")){hAngle=0;mAngle=0;}
 else if(t.includes("een uur")){hAngle=30;mAngle=0;}
 else if(t.includes("drie uur")){hAngle=90;mAngle=0;}
 else if(t.includes("vijf uur")){hAngle=150;mAngle=0;}
 else if(t.includes("zeven uur")){hAngle=210;mAngle=0;}
 else if(t.includes("negen uur")){hAngle=270;mAngle=0;}
 else if(t.includes("tien uur")){hAngle=300;mAngle=0;}
 else if(t.includes("half twee")){hAngle=45;mAngle=180;}
 else if(t.includes("half vier")){hAngle=105;mAngle=180;}
 else if(t.includes("half zes")){hAngle=165;mAngle=180;}
 else if(t.includes("half acht")){hAngle=225;mAngle=180;}
 else if(t.includes("kwart over twee")){hAngle=67.5;mAngle=90;}
 else if(t.includes("kwart over acht")){hAngle=247.5;mAngle=90;}
 else if(t.includes("kwart voor drie")){hAngle=82.5;mAngle=270;}
 else if(t.includes("kwart voor tien")){hAngle=292.5;mAngle=270;}
 else{hAngle=0;mAngle=0;}

 const handH=el("div","clock-hand-h");handH.style.transform=`rotate(${hAngle}deg)`;
 const handM=el("div","clock-hand-m");handM.style.transform=`rotate(${mAngle}deg)`;
 wrap.append(handH,handM);
 return wrap;
}

function renderStudyControls(card){
 const u=getUI(),fb=el("div","feedback");fb.id="feedback";

 if(item["ex_"+targetLang])fb.appendChild(tgt(el("p","example",item["ex_"+targetLang])));

  const s=stateFor(item.id);s.seen++;s.due=Date.now()+864e5;

  try{say(spoken())}catch(e){}
  nextQuestion();
 };row.appendChild(known);

  const s=stateFor(item.id);s.seen++;s.wrong++;s.streak=0;s.known=false;s.due=Date.now();
  saveStore();updateStats();nextQuestion();
 };row.appendChild(again);card.appendChild(row);
}

function answer(ok,btn){
 if(locked)return;locked=true;
 const u=getUI(),s=stateFor(item.id);s.seen++;
 if(ok){right++;roundPoints+=10;score+=10;s.correct++;s.streak++;s.due=Date.now()+(s.streak>=3?3:1)*864e5}
 else{s.wrong++;s.streak=0;s.due=Date.now()}
 s.known=s.streak>=2;
 saveStore();updateStats();
 document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.ok==="1")b.classList.add("correct")});
 if(!ok)btn.classList.add("incorrect");
 const fb=$("feedback");fb.replaceChildren();
 fb.appendChild(el("strong","",ok?u.correct:u.incorrect));
 fb.appendChild(tgt(el("p","",shown(item))));
 fb.appendChild(el("p","",meaningFor(item)));
 const exK="ex_"+targetLang,trK="ex_"+uiLang;
 if(item[exK])fb.appendChild(tgt(el("p","example",item[exK])));
 if(item[trK])fb.appendChild(el("p","",item[trK]));
 const nx=$("nx");
 nx.disabled=false;
 say(item[exK]||shown(item));
 setTimeout(()=>nx.scrollIntoView({behavior:"smooth",block:"nearest"}),100);
}

 end.appendChild(grid);

 const nt=el("button","btn primary",u.nextTopic);nt.type="button";nt.onclick=()=>{
  const catObj=CATEGORIES.find(c=>c.id===currentCat)||CATEGORIES[0];
  const allSubs=["all", ...catObj.tabs.filter(tabVisible)];
  const nextIdx=(allSubs.indexOf(tab)+1)%allSubs.length;
  tab=allSubs[nextIdx];
  saveStore();buildNav();newRound();
 };if(mode!=="build")row.appendChild(nt);
 end.appendChild(row);card.appendChild(end);round++;
}

let toetsId = null, toetsQ = 0, toetsRight = 0, toetsLocked = false;

function startToets(){
  // Neutralize category highlight — toets is independent of topic tabs
  document.querySelectorAll("#catNav button").forEach(b=>b.setAttribute("aria-selected","false"));
  document.querySelectorAll("#subNav button").forEach(b=>b.setAttribute("aria-selected","false"));
  const u = getUI();
  const card = $("card");
  card.replaceChildren();
  $("prog").textContent = "";
  $("rnd").textContent = u.modes.toets || "Toets A1";
  $("barfill").style.width = "0%";
  const title = el("div","q");
  title.appendChild(el("h2","",u.toetsChoose || "Обери тест"));
  card.appendChild(title);
  TOETS.forEach(t => {
    const b = el("button","btn");
    b.type = "button";
    b.style.marginBottom = "8px";
    b.style.width = "100%";
    b.textContent = (t.title[uiLang] || t.title.en || t.id) + " (" + t.questions.length + ")";
    b.onclick = () => {
      toetsId = t.id;
      toetsQ = 0;
      toetsRight = 0;
      toetsLocked = false;
      nextToetsQuestion();
    };
    card.appendChild(b);
  });
}

function nextToetsQuestion(){
  const test = TOETS.find(t => t.id === toetsId);
  if(!test){ startToets(); return; }
  if(toetsQ >= test.questions.length){ endToets(); return; }
  toetsLocked = false;
  const item = test.questions[toetsQ];
  const u = getUI();
  $("prog").textContent = (u.toetsQ||"Питання") + " " + (toetsQ+1) + " " + (u.toetsOf||"з") + " " + test.questions.length;
  $("rnd").textContent = (test.title[uiLang] || test.title.en);
  const pct = Math.round(toetsQ / test.questions.length * 100);
  $("barfill").style.width = pct + "%";
  $("barfill").parentElement.setAttribute("aria-valuenow", String(pct));

  const card = $("card");
  card.replaceChildren();
  const top = el("div","q");

  if(item.type === "read" && item.text){
    const txt = el("p","", item.text);
    txt.style.fontSize = "16px";
    txt.style.fontWeight = "600";
    txt.style.marginBottom = "10px";
    txt.style.whiteSpace = "pre-line";
    txt.style.textAlign = "left";
    txt.style.padding = "10px";
    txt.style.background = "var(--soft)";
    txt.style.borderRadius = "12px";
    top.appendChild(txt);
  }

  const qText = item.q[uiLang] || item.q.en || item.q.uk || "";
  top.appendChild(el("small","", qText));

  if(item.type === "gap" && item.sentence){
    const sent = el("h2","", item.sentence.replace("___","______"));
    sent.style.marginTop = "8px";
    top.appendChild(tgt(sent));
  }

  card.appendChild(top);

  const opts = el("div","opts");
  card.appendChild(opts);
  const fb = el("div","feedback");
  fb.id = "feedback";
  card.appendChild(fb);
  const row = el("div","row");
  const nx = el("button","btn primary", u.toetsNext || u.next || "Далі");
  nx.type = "button";
  nx.disabled = true;
  nx.id = "nx";
  nx.onclick = () => { toetsQ++; nextToetsQuestion(); };
  row.appendChild(nx);
  card.appendChild(row);

  const optLabel = (opt) => {
    if (opt && typeof opt === "object") return opt[uiLang] || opt.en || opt.uk || Object.values(opt)[0] || "";
    return String(opt ?? "");
  };
  shuffle((item.opts || []).map((opt, i) => ({opt, i}))).forEach(({opt, i}) => {
    const b = el("button","opt");
    b.type = "button";
    b.dataset.ok = (i === item.ok) ? "1" : "";
    const label = optLabel(opt);
    const t = el("span","", label);
    if(item.type === "gap") tgt(t); // Dutch gap words only
    b.appendChild(t);
    b.onclick = () => answerToets(i === item.ok, b, item);
    opts.appendChild(b);
  });
}

function answerToets(ok, btn, item){
  if(toetsLocked) return;
  toetsLocked = true;
  const u = getUI();
  if(ok){ toetsRight++; score+=10; saveStore(); updateStats(); }
  document.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    if(b.dataset.ok === "1") b.classList.add("correct");
  });
  if(!ok) btn.classList.add("incorrect");
  const fb = $("feedback");
  fb.replaceChildren();
  fb.appendChild(el("strong","", ok ? (u.correct||"Правильно!") : (u.incorrect||"Неправильно.")));
  if(!ok && item.opts){
    const ans = item.opts[item.ok];
    const label = (ans && typeof ans === "object") ? (ans[uiLang]||ans.en||ans.uk||"") : String(ans??"");
    fb.appendChild(el("p","example", label));
  }
  const nx = $("nx");
  if(nx) nx.disabled = false;
  if(ok){
    const ans = item.opts ? item.opts[item.ok] : "";
    const spoken = (ans && typeof ans === "object") ? (ans.nl || ans.en || "") : String(ans||"");
    // only speak Dutch-looking gap answers
    if(item.type==="gap" && spoken) say(spoken);
  }
  if(nx) setTimeout(() => nx.scrollIntoView({behavior:"smooth", block:"nearest"}), 100);
}

function endToets(){
  const test = TOETS.find(t => t.id === toetsId);
  const total = test ? test.questions.length : 0;
  const pct = total ? Math.round(toetsRight / total * 100) : 0;
  const u = getUI();
  $("barfill").style.width = "100%";
  const card = $("card");
  card.replaceChildren();
  const end = el("div","end");
  end.appendChild(el("h2","", toetsRight + " / " + total));
  end.appendChild(el("p","", pct + "% · " + (pct >= 70 ? (u.toetsPassed||"Склав!") : (u.toetsFailed||"Ще практика"))));
  const grid = el("div","summary-grid");
  [[u.right||"Правильні", toetsRight],[u.points||"Балів", toetsRight*10],[u.toetsScore||"Результат", pct+"%"]].forEach(([l,v])=>{
    const d = el("div"); d.append(el("strong","",v), el("span","",l)); grid.appendChild(d);
  });
  end.appendChild(grid);
  const row = el("div","row");
  const again = el("button","btn", u.toetsAgain || "Ще раз");
  again.type = "button";
  again.onclick = () => { toetsQ=0; toetsRight=0; nextToetsQuestion(); };
  row.appendChild(again);
  const back = el("button","btn primary", u.toetsBack || "До тестів");
  back.type = "button";
  back.onclick = startToets;
  row.appendChild(back);
  end.appendChild(row);
  card.appendChild(end);
}

const SENT=Object.entries(BUILD_BANK).flatMap(([cat,rows])=>(rows||[]).filter(r=>Array.isArray(r)&&typeof r[1]==="string").map(r=>({cat,level:r[0],q:r[1].split("|"),roles:String(r[2]||"").replace(/\s/g,""),uk:r[3],en:r[4],fr:r[5],ar:r[6],x:r[7],again:false}))); 
let bAudio=false,bs=null,buildLevel=Number(validStored("poly_buildLevel",["1","2"],"1"))||1;
if(![1,2].includes(buildLevel))buildLevel=1;
const sentence=s=>{const t=s.q.join(" ");return t[0].toUpperCase()+t.slice(1)+"?"};

function nextBuild(){
 locked=false;const s=deck.pop();q++;sessionIds.push("b"+q);
 // Richer decoys for higher levels: fixed + random words from other sentences
 const fixedDecoys=buildLevel===1?[]:["misschien","graag","altijd","vandaag"];
 let extraPool=[];
 if(buildLevel>=2){
  SENT.filter(x=>x.cat===currentCat&&x!==s).forEach(x=>x.q.forEach(w=>{if(!s.q.includes(w)&&!fixedDecoys.includes(w))extraPool.push(w)}));
  extraPool=shuffle([...new Set(extraPool)]).slice(0,2);
 }
 const decoys=fixedDecoys.concat(extraPool);
 const extras=(s.x?[s.x]:[]).concat(decoys).filter((w,i,a)=>!s.q.includes(w)&&a.indexOf(w)===i);
 const tiles=shuffle(s.q.map(w=>({w})).concat(extras.map(w=>({w}))));
 bs={s,tiles,slots:s.q.map(()=>null),stars:3,lock:false,done:false,bad:[]};
 renderBuild();if(bAudio)say(sentence(s));
}
function placeTile(t){
 if(bs.done||bs.lock)return;
 const k=bs.slots.indexOf(null);if(k<0)return;
 bs.slots[k]=t;afterPlace();
}
function clearSlot(k){if(bs.done||bs.lock||!bs.slots[k])return;bs.slots[k]=null;bs.bad=[];renderBuild()}
function afterPlace(){if(bs.slots.every(Boolean))checkBuild();else renderBuild()}
function checkBuild(){
 const cur=bs,bad=cur.s.q.map((w,k)=>cur.slots[k].w===w?-1:k).filter(k=>k>=0);
 if(!bad.length){finishBuild();return}
 cur.stars=Math.max(1,cur.stars-1);cur.bad=bad;cur.lock=true;renderBuild();
 setTimeout(()=>{if(bs!==cur||cur.done)return;bad.forEach(k=>{cur.slots[k]=null});cur.bad=[];cur.lock=false;renderBuild()},850);
}
function hintBuild(){
 if(bs.done||bs.lock)return;
 const {s,slots,tiles}=bs,k=s.q.findIndex((w,i)=>!slots[i]||slots[i].w!==w);if(k<0)return;
 const t=tiles.find(x=>x.w===s.q[k]),j=slots.indexOf(t);if(j>=0)slots[j]=null;
 slots[k]=t;bs.stars=Math.max(1,bs.stars-1);bs.bad=[];afterPlace();
}
function finishBuild(){
 const cur=bs,s=cur.s;cur.done=true;locked=true;
 if(!s.again){
  const pts=cur.stars===3?10:cur.stars===2?7:4;score+=pts;roundPoints+=pts;
  if(cur.stars===3)right++;else{s.again=true;deck.unshift(s);roundTotal++}
  saveStore();updateStats();
 }
 renderBuild();
 say(sentence(s));
 setTimeout(()=>{
  const nx=$("nx");
  if(nx)nx.scrollIntoView({behavior:"smooth",block:"nearest"});
 },100);
}
function renderBuild(){
 const u=getUI(),s=bs.s;
 $("prog").textContent=u.lessonProgress+" "+q+" / "+roundTotal;$("rnd").textContent=u.round+" "+round+" · "+u.build;updateProgress();
 const card=$("card");card.replaceChildren();
 const levelBar=el("div","row build-levels");levelBar.style.justifyContent="center";levelBar.style.marginBottom="10px";levelBar.setAttribute("aria-label",u.buildLevel);[1,2].forEach(lv=>{const lb=el("button","btn"+(buildLevel===lv?" primary":""),u.buildLevel+" "+lv);lb.type="button";lb.setAttribute("aria-pressed",String(buildLevel===lv));lb.onclick=()=>{if(buildLevel!==lv){buildLevel=lv;newRound()}};levelBar.appendChild(lb)});card.replaceChildren(levelBar);
 const top=el("div","q");top.appendChild(el("small","",u.buildSub));
 if(bAudio&&!bs.done)top.appendChild(el("div","icon-box","🔊"));else top.appendChild(el("h2","sm",s[uiLang]||s.en));
 const tools=el("div","row");tools.style.justifyContent="center";
 const hear=el("button","listen",u.listen);hear.type="button";hear.onclick=()=>say(sentence(s));
 const ear=el("button","listen",(bAudio?"✓ ":"")+u.byEar);ear.type="button";
 ear.onclick=()=>{bAudio=!bAudio;renderBuild();if(bAudio&&!bs.done)say(sentence(s))};
 tools.append(hear,ear);top.appendChild(tools);card.appendChild(top);
 const slots=el("div","slots");
 s.roles.split("").forEach((r,k)=>{
  const w=el("div","sw2 r"+r);w.appendChild(el("span","role",u.roles[r]));
  const t=bs.slots[k],b=el("button","slot"+(t?" filled":"")+(bs.bad.includes(k)?" bad":"")+(bs.done?" good":""),t?t.w:"");
  b.type="button";if(t)tgt(b);b.onclick=()=>clearSlot(k);w.appendChild(b);slots.appendChild(w);
 });
 card.appendChild(slots);
 const bank=el("div","bank");
 if(!bs.done)bs.tiles.filter(t=>!bs.slots.includes(t)).forEach(t=>{const b=el("button","opt tile",t.w);tgt(b);b.type="button";b.onclick=()=>placeTile(t);bank.appendChild(b)});
 card.appendChild(bank);
 const fb=el("div","feedback");fb.id="feedback";
 if(bs.done){fb.appendChild(el("strong","","⭐".repeat(bs.stars)+" "+u.correct));fb.appendChild(tgt(el("p","example",sentence(s))));fb.appendChild(el("p","",s[uiLang]||s.en))}
 card.appendChild(fb);
 const row=el("div","row");
 if(bs.done){const nx=el("button","btn primary",u.next);nx.type="button";nx.id="nx";nx.onclick=nextQuestion;row.appendChild(nx)}
 else{const h=el("button","btn",u.hint);h.type="button";h.disabled=bs.lock;h.onclick=hintBuild;row.appendChild(h)}
 card.appendChild(row);
}

// --- Mini translator / word search ---
function allVocab(){
  const out=[];
  Object.keys(DATA).forEach(k=>{
    const block=DATA[k];
    if(block&&Array.isArray(block.items)){
      block.items.forEach(it=>{
        if(it&&it.nl) out.push(it);
      });
    }
  });
  return out;
}
function openSearch(){
  const u=getUI();
  const modal=$("searchModal");
  const inp=$("searchInput");
  if(!modal||!inp) return;
  modal.hidden=false;
  inp.placeholder=u.searchPh||"Zoek een woord…";
  inp.value="";
  $("searchResults").replaceChildren();
  inp.focus();
}
function closeSearch(){
  const modal=$("searchModal");
  if(modal) modal.hidden=true;
}
function runSearch(){
  const u=getUI();
  const q=($("searchInput").value||"").trim().toLowerCase();
  const box=$("searchResults");
  box.replaceChildren();
  if(q.length<1){return;}
  const lang=uiLang==="uk"?"uk":uiLang==="fr"?"fr":uiLang==="ar"?"ar":"en";
  const hits=allVocab().filter(it=>{
    const fields=[it.nl,it.en,it.fr,it.uk,it.ar,it.ex_nl,it.ex_uk].filter(Boolean).map(s=>String(s).toLowerCase());
    return fields.some(f=>f.includes(q));
  }).slice(0,30);
  if(!hits.length){
    box.appendChild(el("div","search-empty",u.searchEmpty||"Nothing found"));
    return;
  }
  hits.forEach(it=>{
    const div=el("div","search-item");
    const nl=el("div","nl",it.nl||"");
    div.appendChild(nl);
    const tr=el("div","tr",(it[lang]||it.en||it.uk||""));
    div.appendChild(tr);
    if(it.ex_nl){
      const ex=el("div","ex",it.ex_nl+(it.ex_uk?" — "+it.ex_uk:""));
      div.appendChild(ex);
    }
    div.addEventListener("click",()=>{ if(it.nl) say(it.nl); });
    box.appendChild(div);
  });
}
$("searchBtn")&&$("searchBtn").addEventListener("click",openSearch);
$("searchClose")&&$("searchClose").addEventListener("click",closeSearch);
$("searchModal")&&$("searchModal").addEventListener("click",e=>{ if(e.target===$("searchModal")) closeSearch(); });
$("searchInput")&&$("searchInput").addEventListener("input",runSearch);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSearch(); });

$("themeToggle").addEventListener("click",()=>{
 const order=["glass","oranje","dark"];
 const cur=document.documentElement.dataset.theme||"glass";
 const i=order.indexOf(cur);
 const n=order[(i<0?0:i+1)%order.length];
 document.documentElement.dataset.theme=n;
 try{localStorage.setItem("poly_theme",n)}catch(e){}
 updateHeader();
});

function start(){
 try{
  const t=localStorage.getItem("poly_theme");
  if(t==="glass"||t==="oranje"||t==="dark")document.documentElement.dataset.theme=t;
  else if(t==="light")document.documentElement.dataset.theme="oranje";
  else document.documentElement.dataset.theme="glass";
 }catch(e){document.documentElement.dataset.theme="glass"}
 updateHeader();buildNav();newRound();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", start);
} else {
  start();
}
