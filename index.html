<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EB6A00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leren.be">
<meta name="application-name" content="Leren.be">
<meta name="description" content="Вивчення нідерландської мови A1.1 з вправами, тестами та повторенням.">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preload" href="./fonts/unbounded.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="./fonts/nunito.woff" as="font" type="font/woff" crossorigin>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>Leren.be — Nederlands A1.1</title>
<style>
/* =========================================================
   Leren.be design system v2 — "Oranje × België"
   Tokens → base → layout → components. One theme layer, no !important wars.
   ========================================================= */
@font-face{font-family:"Nunito";src:url("./fonts/nunito.woff") format("woff");font-weight:200 1000;font-style:normal;font-display:swap}
@font-face{font-family:"Unbounded";src:url("./fonts/unbounded.woff") format("woff");font-weight:200 900;font-style:normal;font-display:swap}

:root{
 color-scheme:light;
 /* brand */
 --oranje:#EB6A00; --oranje-deep:#B04A00; --oranje-soft:#FFE7CF;
 --be-black:#1E1712; --be-yellow:#FDDA24; --be-yellow-deep:#C9A400; --be-red:#EF3340; --be-red-deep:#B81E2A;
 /* surfaces */
 --bg:#FFF6EC; --surface:#FFFFFF; --surface-2:#FFF0E0; --line:#EED9C4; --edge:#E2C7AC;
 --ink:#2A1D12; --ink-2:#6F5A47; --on-oranje:#FFFFFF;
 /* semantic */
 --ok:#16955A; --ok-deep:#0E7344; --ok-soft:#E3F7EC;
 --bad:var(--be-red); --bad-deep:var(--be-red-deep); --bad-soft:#FDE6E8;
 /* roles in sentence builder */
 --role-q:#2F7FD8; --role-v:var(--ok); --role-s:#D98A00; --role-r:var(--ink-2);
 /* shape & depth */
 --r-sm:12px; --r-md:16px; --r-lg:22px; --r-pill:999px;
 --depth:5px; --depth-sm:3px;
 --lift:0 10px 24px -14px rgba(120,60,10,.35);
 /* type */
 --font-display:"Unbounded","Nunito",system-ui,sans-serif;
 --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;
 /* motion */
 --press:.08s; --ease:cubic-bezier(.2,.8,.2,1);
 /* compat aliases used by older inline code */
 --fg:var(--ink); --mut:var(--ink-2); --card:var(--surface); --soft:var(--surface-2); --acc:var(--oranje); --ok-bg:var(--ok-soft); --bad-bg:var(--bad-soft); --amb:#D98A00; --pop:var(--oranje);
}
:root[data-theme="dark"]{
 color-scheme:dark;
 --oranje:#EB6A00; --oranje-deep:#9A4100; --oranje-soft:#3D2614;
 --be-black:#0E0A07;
 --bg:#1A1411; --surface:#271F19; --surface-2:#30261E; --line:#41352B; --edge:#120D0A;
 --ink:#FFF4E8; --ink-2:#C7B29E;
 --ok:#3DD68C; --ok-deep:#1E8F58; --ok-soft:#173326;
 --bad:#FF5D68; --bad-deep:#B3202B; --bad-soft:#3A1B1E;
 --role-q:#6FB2FF; --role-s:#FFC24A;
 --lift:0 12px 26px -14px rgba(0,0,0,.7);
}

/* ---------- base ---------- */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{min-height:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-body);font-weight:600;min-height:100vh;
 padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
main{width:100%;max-width:640px;margin:0 auto;padding:12px 14px 24px;display:flex;flex-direction:column;gap:14px}

/* reusable 3D surface: solid "edge" under the element, pressed state removes it */
.btn,.opt,.listen,.nav-cats button,.kl-col,.theme-btn,.score-pill,.lang-select,.report-bug-btn,.slot.filled{
 transition:transform var(--press) var(--ease),box-shadow var(--press) var(--ease),background-color .15s,border-color .15s,color .15s}

/* ---------- header ---------- */
header{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
 background:radial-gradient(circle at 100% 0,rgba(255,255,255,.14) 0 90px,transparent 91px),var(--oranje);color:var(--on-oranje);border-radius:var(--r-lg);padding:14px 14px 14px 18px;
 box-shadow:0 var(--depth) 0 var(--oranje-deep),var(--lift);overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand::before{content:"";flex:none;width:22px;height:28px;border-radius:5px;
 background:linear-gradient(90deg,var(--be-black) 0 33.3%,var(--be-yellow) 33.3% 66.6%,var(--be-red) 66.6%);
 box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.brand h1{font-family:var(--font-display);font-size:22px;line-height:1;margin:0;font-weight:800;letter-spacing:-.01em}
.brand p{margin:0;padding:3px 8px;border-radius:var(--r-pill);background:rgba(0,0,0,.16);font-size:12px;font-weight:800;line-height:1.2}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-inline-end:52px}
.select-group{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:rgba(255,255,255,.9)}
.lang-select,.theme-btn,.score-pill{min-height:38px;border-radius:var(--r-sm);border:0;font-weight:800;font-size:13px}
.lang-select option{background:#fff;color:#2A1D12}
.lang-select{background:#FFFFFF;color:#2A1D12;padding:0 8px;box-shadow:0 var(--depth-sm) 0 rgba(120,50,0,.35);cursor:pointer}
#themeToggle{position:absolute;top:12px;inset-inline-end:12px;z-index:2}
.brand{padding-inline-end:52px}
.theme-btn{min-width:40px;background:rgba(60,25,0,.22);color:#fff;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
#searchBtn{background:#fff;color:#2A1D12;box-shadow:0 var(--depth-sm) 0 rgba(120,50,0,.35)}
#searchBtn:active{transform:translateY(var(--depth-sm));box-shadow:none}
.score-pill{display:inline-flex;align-items:center;padding:0 12px;background:var(--be-black);color:var(--be-yellow);white-space:nowrap;box-shadow:0 var(--depth-sm) 0 rgba(0,0,0,.35)}
.auto-speech-btn{min-height:38px;padding:0 7px;border:2px solid rgba(255,255,255,.45);border-radius:var(--r-sm);background:rgba(60,25,0,.22);color:#fff;font-size:12px;font-weight:800;white-space:nowrap;cursor:pointer}
.auto-speech-btn[aria-pressed="true"]{background:#fff;color:#2A1D12}
#speechStatus{font-size:12px;font-weight:900;white-space:nowrap}
#speechStatus[hidden]{display:none}
.speech-controls{display:flex;align-items:center;gap:6px}
.voice-dialog{width:min(440px,calc(100% - 32px));padding:0;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);color:var(--ink);box-shadow:0 16px 48px rgba(0,0,0,.28)}
.voice-dialog::backdrop{background:rgba(20,15,12,.5)}
.voice-dialog-content{padding:20px}
.voice-dialog h2{margin:0 0 16px;font-size:20px}
.voice-dialog label{display:grid;gap:8px;font-weight:800}
.voice-dialog select{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink);font:inherit}
.voice-dialog p{margin:10px 0 16px;color:var(--ink-2);font-size:13px}
.voice-dialog .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.speech-help{margin:10px auto 0;max-width:520px;padding:12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2);color:var(--ink);font-size:14px}
.speech-help p{margin:0 0 8px}
.speech-help a{display:inline-block;margin:3px 10px;color:var(--oranje);font-weight:900}
.listen.is-speaking{outline:3px solid var(--oranje);outline-offset:3px;animation:speechPulse 1s ease-in-out infinite alternate}
@keyframes speechPulse{to{filter:brightness(.85);transform:scale(1.03)}}

/* stats live inside the orange zone visually: a slim bar right under it */
.stats-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 6px;font-size:14px;color:var(--ink-2)}
.stats-bar strong{color:var(--ink);font-size:16px;font-weight:900;margin-inline-start:2px}
#reviewCount{padding:4px 10px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--ink);font-weight:800;font-size:13px}

/* ---------- navigation ---------- */
.nav-section{display:flex;flex-direction:column;gap:10px}
.section-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nav-fade-wrap{position:relative;margin:0 -14px}
.nav-fade-wrap::after{content:"";position:absolute;right:0;top:0;bottom:6px;width:32px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--bg))}
.nav-cats{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 14px 10px;scroll-snap-type:x proximity;scroll-padding-inline:14px}
.nav-cats::-webkit-scrollbar{display:none}
.nav-cats button{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;
 padding:11px 16px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--surface);color:var(--ink);
 font-weight:800;font-size:15px;box-shadow:0 var(--depth-sm) 0 var(--edge)}
.nav-cats button:active{transform:translateY(var(--depth-sm));box-shadow:0 0 0 var(--edge)}
.nav-cats button[aria-selected="true"]{background:var(--oranje);border-color:var(--oranje);color:#fff;box-shadow:0 var(--depth-sm) 0 var(--oranje-deep)}
.sub-wrapper{margin:0 -14px}
.nav-subs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 14px 2px}
.nav-subs::-webkit-scrollbar{display:none}
.nav-subs button{flex:none;white-space:nowrap;cursor:pointer;padding:8px 14px;border-radius:var(--r-pill);border:0;background:transparent;color:var(--ink-2);font-weight:800;font-size:14px}
.nav-subs button[aria-selected="true"]{background:var(--be-black);color:#fff}
:root[data-theme="dark"] .nav-subs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.nav-scrollbar{display:block;position:relative;height:14px;margin:0 2px 2px;border-radius:var(--r-pill);background:var(--surface-2);box-shadow:inset 0 2px 3px rgba(0,0,0,.08);touch-action:none;cursor:pointer;user-select:none}
.nav-scroll-thumb{position:absolute;inset-block:1px;left:0;min-width:36px;border-radius:var(--r-pill);background:var(--oranje);box-shadow:inset 0 -2px 0 rgba(0,0,0,.16),inset 0 2px 0 rgba(255,255,255,.32);cursor:grab;will-change:transform}
.nav-scrollbar:active .nav-scroll-thumb{cursor:grabbing}
.nav-scrollbar:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* ---------- progress ---------- */
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--ink-2);font-size:13px;font-weight:800;padding:0 4px;margin-bottom:-6px}
.bar{height:12px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.06)}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:var(--oranje);
 box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),inset 0 3px 0 rgba(255,255,255,.35);transition:width .35s var(--ease)}

/* ---------- card ---------- */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);padding:18px 16px 18px;
 box-shadow:0 var(--depth) 0 var(--edge);display:flex;flex-direction:column;gap:14px;min-width:0}
.q{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.q small{color:var(--ink-2);font-size:14px;font-weight:800;line-height:1.3}
.icon-box{font-size:52px;line-height:1;margin:6px 0 2px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.08))}
.icon-box svg{width:64px;height:64px}
.q h2{font-family:var(--font-display);font-size:clamp(24px,7vw,34px);font-weight:700;line-height:1.15;margin:4px 0 0;letter-spacing:-.01em;overflow-wrap:anywhere}
.q h2.sm{font-size:clamp(18px,5vw,22px)}
.q p{margin:0;color:var(--ink-2);font-size:15px}

/* yellow audio button — the Belgian yellow lives here */
.listen{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;margin-top:8px;min-height:40px;
 padding:0 16px;border-radius:var(--r-pill);border:0;background:var(--be-yellow);color:#2A1D12;font-weight:900;font-size:14px;
 box-shadow:0 var(--depth-sm) 0 var(--be-yellow-deep)}
.listen:active{transform:translateY(var(--depth-sm));box-shadow:0 0 0 var(--be-yellow-deep)}

/* ---------- answer tiles ---------- */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;cursor:pointer;
 min-height:58px;padding:10px 10px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--surface);color:var(--ink);
 font-weight:800;font-size:16px;line-height:1.2;overflow-wrap:anywhere;box-shadow:0 var(--depth) 0 var(--edge)}
.opt:active:not(:disabled){transform:translateY(var(--depth));box-shadow:0 0 0 var(--edge)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--ok-soft);border-color:var(--ok);color:var(--ok-deep);box-shadow:0 var(--depth) 0 var(--ok);animation:pop .35s var(--ease)}
:root[data-theme="dark"] .opt.correct{color:var(--ok)}
.opt.incorrect{background:var(--bad-soft);border-color:var(--bad);color:var(--bad-deep);box-shadow:0 var(--depth) 0 var(--bad);animation:shake .3s}
:root[data-theme="dark"] .opt.incorrect{color:var(--bad)}
.opt:disabled:not(.correct):not(.incorrect){opacity:.55}
.swatch{width:16px;height:16px;border-radius:50%;border:2px solid rgba(0,0,0,.15);flex-shrink:0}

/* ---------- feedback ---------- */
.feedback{border-radius:var(--r-md);padding:12px 14px;text-align:center;background:var(--surface-2);display:flex;flex-direction:column;gap:3px}
.feedback:empty{display:none}
.feedback strong{font-size:16px;font-weight:900;line-height:1.3}
.feedback p{margin:0;color:var(--ink-2);font-size:14px}
.feedback .example{color:var(--ink);font-weight:800;font-size:15px}

/* ---------- buttons ---------- */
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:110px;min-height:52px;padding:10px 16px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--surface);color:var(--ink);
 font-weight:900;font-size:15px;cursor:pointer;text-align:center;box-shadow:0 var(--depth) 0 var(--edge)}
.btn:active:not(:disabled){transform:translateY(var(--depth));box-shadow:0 0 0 var(--edge)}
.btn.primary{background:var(--oranje);border-color:var(--oranje);color:#fff;font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.01em;box-shadow:0 var(--depth) 0 var(--oranje-deep)}
.btn.primary:active:not(:disabled){box-shadow:0 0 0 var(--oranje-deep)}
.btn:disabled{cursor:default;background:var(--surface-2);border-color:var(--line);color:var(--ink-2);box-shadow:0 var(--depth) 0 var(--line);filter:none;font-family:var(--font-body)}
.build-levels{gap:8px}
.build-levels .btn{min-height:44px;font-size:14px;min-width:0;font-family:var(--font-body);font-weight:900;box-shadow:0 var(--depth-sm) 0 var(--edge)}
.build-levels .btn.primary{box-shadow:0 var(--depth-sm) 0 var(--oranje-deep)}

/* ---------- bottom mode dock (Belgian black) ---------- */
.modes-wrapper{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));
 width:min(620px,calc(100% - 20px));display:flex;gap:4px;padding:6px;border-radius:20px;background:var(--be-black);
 box-shadow:0 12px 30px -8px rgba(0,0,0,.45)}
.modes-wrapper button{flex:1 1 0;min-width:0;min-height:54px;padding:4px 2px;border:0;border-radius:14px;background:transparent;color:rgba(255,255,255,.72);
 font-weight:800;font-size:12px;line-height:1.1;cursor:pointer;white-space:normal}
.modes-wrapper button.primary{background:var(--be-yellow);color:#2A1D12;box-shadow:0 var(--depth-sm) 0 var(--be-yellow-deep);transform:translateY(-2px)}


.modes-wrapper button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dock-ic{font-size:18px;line-height:1}
.dock-tx{font-size:11.5px;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- clock ---------- */
.clock-visual{width:128px;height:128px;border-radius:50%;background:var(--surface);border:6px solid var(--oranje);margin:6px auto 4px;position:relative;
 display:flex;align-items:center;justify-content:center;box-shadow:0 var(--depth) 0 var(--oranje-deep),inset 0 0 0 4px var(--surface-2)}
.clock-center{width:12px;height:12px;background:var(--be-black);border:3px solid var(--be-yellow);border-radius:50%;position:absolute;z-index:3}
:root[data-theme="dark"] .clock-center{background:var(--ink)}
.clock-hand-h{width:5px;height:32px;background:var(--ink);position:absolute;bottom:58px;left:55.5px;border-radius:3px;transform-origin:bottom center;z-index:2}
.clock-hand-m{width:3px;height:46px;background:var(--be-red);position:absolute;bottom:58px;left:56.5px;border-radius:3px;transform-origin:bottom center;z-index:1}

/* ---------- end of round ---------- */
.end{text-align:center;display:flex;flex-direction:column;gap:12px}
.end h2{font-family:var(--font-display);font-size:44px;font-weight:800;margin:4px 0 0;color:var(--oranje)}
.end p{color:var(--ink-2);margin:0;font-weight:800}
.summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.summary-grid div{padding:12px 6px;border-radius:var(--r-md);background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.summary-grid strong{font-family:var(--font-display);font-size:22px;font-weight:700}
.summary-grid span{font-size:12px;color:var(--ink-2);font-weight:800}
.empty{color:var(--ink-2);text-align:center;padding:14px 8px;font-size:15px}

/* ---------- sentence builder ---------- */
.slots,.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr}
.bank{min-height:52px;padding-top:4px}
.sw2{display:flex;flex-direction:column;align-items:center;gap:4px}
.sw2.rQ{--rc:var(--role-q)}.sw2.rV{--rc:var(--role-v)}.sw2.rS{--rc:var(--role-s)}.sw2.rR{--rc:var(--role-r)}
.role{font-size:12px;font-weight:900;color:var(--rc)}
.slot{min-width:64px;min-height:46px;padding:6px 10px;border-radius:var(--r-sm);border:2px dashed var(--line);border-bottom:4px solid var(--rc);background:var(--surface-2);
 color:var(--ink);font-weight:800;font-size:15px;cursor:pointer}
.slot.filled{border-style:solid;border-color:var(--line);border-bottom-color:var(--rc);background:var(--surface)}
.slot.bad{border-color:var(--bad);border-bottom-color:var(--bad);color:var(--bad);background:var(--bad-soft);animation:shake .3s}
.slot.good{border-color:var(--ok);border-bottom-color:var(--ok);color:var(--ok-deep);background:var(--ok-soft)}
:root[data-theme="dark"] .slot.good{color:var(--ok)}
.opt.tile{min-height:46px;padding:8px 14px;font-size:15px}

/* ---------- toets ---------- */
.toets-text{font-size:16px;font-weight:700;white-space:pre-line;text-align:start;padding:14px;margin-bottom:6px;background:var(--surface-2);border-radius:var(--r-md);border-inline-start:5px solid var(--oranje)}
.toets-pick{width:100%;flex:none;margin-bottom:12px;text-align:start;justify-content:flex-start}

/* ---------- Kort / lang ---------- */
.kl-word{display:flex;justify-content:center;margin:12px 0 6px}
.kl-word .kl-mag{font-size:32px;padding:12px 24px}
.kl-mag{display:inline-block;background:#fff;color:#222;font-family:Georgia,"Times New Roman",serif;text-transform:uppercase;letter-spacing:.06em;font-size:15px;line-height:1.2;
 padding:6px 11px;border-radius:4px;box-shadow:0 3px 0 rgba(0,0,0,.18),0 6px 12px -6px rgba(0,0,0,.3);position:relative;margin:4px auto;white-space:nowrap}
.kl-mag::before{content:"";position:absolute;top:-5px;left:50%;width:12px;height:9px;margin-left:-6px;background:#2b2b2b;border-radius:2px;opacity:.85}
.kl-mag .v{color:#D32F2F}
.kl-mag.miss{outline:3px solid var(--bad);outline-offset:1px}
.kl-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0}
.kl-col{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:160px;padding:14px 6px 16px;border-radius:var(--r-lg);cursor:pointer;color:var(--ink);text-align:center;border:3px solid}
.kl-col h3{margin:0;font-family:var(--font-display);font-size:24px;font-weight:800}
.kl-col small{color:var(--ink-2);font-size:13px;font-weight:800}
.kl-col.kort{border-color:var(--be-yellow-deep);background:color-mix(in srgb,var(--be-yellow) 22%,var(--surface));box-shadow:0 var(--depth) 0 var(--be-yellow-deep)}
.kl-col.lang{border-color:var(--oranje-deep);background:color-mix(in srgb,var(--oranje) 16%,var(--surface));box-shadow:0 var(--depth) 0 var(--oranje-deep)}
.kl-col:not(:disabled):not(.static):active{transform:translateY(var(--depth));box-shadow:0 0 0 transparent}
.kl-col:disabled,.kl-col.static{cursor:default}
.kl-list{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:6px;width:100%}
.kl-chipbtn{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center}
.kl-hint{text-align:center;color:var(--ink-2);font-size:14px;margin:0}
.kl-verbq{font-size:clamp(22px,6vw,28px)!important}
.kl-rule{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 2px;text-align:center;width:100%}
.kl-rt{border:2px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.kl-rt-h{font-weight:900;font-size:13px;padding:7px;background:var(--surface-2)}
.kl-rt-g{display:grid;grid-template-columns:1fr 1fr}
.kl-rt-c{font-size:12.5px;padding:7px 4px;border-top:2px solid var(--line);color:var(--ink);font-weight:700}
.kl-rt-c:nth-child(odd){border-inline-end:2px solid var(--line)}
.kl-rt-c.ex{cursor:pointer}
.kl-rt-c.ex .kl-mag{font-size:13px;padding:4px 8px}
.kl-rule-note{grid-column:1/-1;font-size:13px;color:var(--ink-2);margin:2px 0 0}
.end .kl-cols{margin-top:8px}

/* ---------- search ---------- */
.search-modal{position:fixed;inset:0;z-index:100;background:rgba(30,23,18,.55);display:flex;align-items:flex-start;justify-content:center;padding:56px 12px 20px;backdrop-filter:blur(3px)}
.search-panel{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:520px;max-height:72vh;display:flex;flex-direction:column;border:2px solid var(--line);box-shadow:0 var(--depth) 0 var(--edge),0 24px 50px -20px rgba(0,0,0,.5)}
.search-head{display:flex;gap:8px;padding:14px;border-bottom:2px solid var(--line);align-items:center}
.search-head input{flex:1;min-height:48px;border:2px solid var(--line);border-radius:var(--r-md);padding:0 14px;font-size:17px;font-weight:700;background:var(--bg);outline:none}
.search-head input:focus{border-color:var(--oranje)}
.search-head .theme-btn{background:var(--surface-2);color:var(--ink);box-shadow:none}
.search-results{overflow-y:auto;padding:10px 14px 16px;flex:1}
.search-item{padding:12px 14px;border-radius:var(--r-md);border:2px solid var(--line);margin-bottom:10px;cursor:pointer;box-shadow:0 var(--depth-sm) 0 var(--edge)}
.search-item:active{transform:translateY(var(--depth-sm));box-shadow:none}
.search-item .nl{font-family:var(--font-display);font-weight:700;font-size:17px;margin-bottom:2px}
.search-item .tr{color:var(--ink-2);font-size:14px}
.search-item .ex{font-size:13px;margin-top:4px;color:var(--ink)}
.search-empty{text-align:center;color:var(--ink-2);padding:24px 8px;font-size:15px}

/* ---------- footer ---------- */
footer{text-align:center;color:var(--ink-2);font-size:13px;margin-top:6px;display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.45;font-weight:700}
footer a{color:inherit}
.report-bug-btn{margin-top:6px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-pill);padding:8px 16px;font-size:13px;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 var(--depth-sm) 0 var(--edge)}
.report-bug-btn:active{transform:translateY(var(--depth-sm));box-shadow:none}
.prog-tools .report-bug-btn{margin-top:0}


/* ---------- progression panel (streak · daily goal · level bar) ---------- */
.progress-panel{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;box-shadow:0 var(--depth-sm) 0 var(--edge)}
.pp-row{display:flex;gap:10px;align-items:stretch}
.pp-streak{display:flex;align-items:center;gap:6px;padding:0 14px;border-radius:var(--r-md);background:var(--be-black);color:#fff;font-family:var(--font-display);font-size:18px;min-height:48px}
.pp-streak.off{background:var(--surface-2);color:var(--ink-2)}
.pp-streak.off .pp-fire{filter:grayscale(1);opacity:.6}
.pp-fire{font-size:20px}
.pp-goal{flex:1;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;align-items:center;gap:4px 10px;padding:6px 12px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:start;box-shadow:0 var(--depth-sm) 0 var(--edge)}
.pp-goal:active{transform:translateY(var(--depth-sm));box-shadow:none}
.pp-goal-l{font-size:13px;font-weight:900;color:var(--ink-2)}
.pp-goal-v{grid-row:1;grid-column:2;font-weight:900;font-size:14px}
.pp-mini{grid-column:1/-1;height:10px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden}
.pp-mini i{display:block;height:100%;border-radius:inherit;background:var(--be-yellow);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);transition:width .4s var(--ease)}
.pp-goal.done{border-color:var(--ok)}
.pp-goal.done .pp-mini i{background:var(--ok)}
.pp-level{display:flex;align-items:center;gap:8px}
.pp-badge{flex:none;font-family:var(--font-display);font-size:13px;font-weight:700;padding:5px 9px;border-radius:10px;background:var(--oranje);color:#fff}
.pp-badge.next{background:var(--surface-2);color:var(--ink)}
.pp-badge.soon{opacity:.75}
.pp-track{flex:1;height:16px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.06)}
.pp-track i{display:block;height:100%;min-width:8px;border-radius:inherit;background:var(--oranje);box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),inset 0 4px 0 rgba(255,255,255,.3);transition:width .5s var(--ease)}
.pp-cap{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);font-weight:800;margin-top:-4px}
.pp-stats strong{color:var(--ink)}
.xp-note{font-size:13px!important;color:var(--ink-2)!important;font-weight:800}

/* ---------- level switch ---------- */
.level-nav{display:flex;gap:8px}
.lv-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:52px;padding:6px 8px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:0 var(--depth-sm) 0 var(--edge);transition:transform var(--press) var(--ease),box-shadow var(--press) var(--ease)}
.lv-btn:active{transform:translateY(var(--depth-sm));box-shadow:none}
.lv-name{font-family:var(--font-display);font-weight:700;font-size:16px}
.lv-tag{font-size:11.5px;font-weight:900;color:var(--ink-2)}
.lv-btn[aria-pressed="true"]{background:var(--be-black);border-color:var(--be-black);color:#fff;box-shadow:0 var(--depth-sm) 0 #000}
.lv-btn[aria-pressed="true"] .lv-tag{color:rgba(255,255,255,.7)}
:root[data-theme="dark"] .lv-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lv-btn.locked,.lv-btn.soon{background:var(--surface-2)}
.lv-btn.soon .lv-name{opacity:.6}

/* ---------- lock card, goal modal, toast ---------- */
.lock-card{padding:6px 0}
.lock-ic{font-size:56px;line-height:1}
.lock-card h2{font-size:24px!important;color:var(--ink)!important}
.lock-card .btn.primary{font-size:15px}
.lock-card p{max-width:46ch;margin:0 auto!important;color:var(--ink-2);line-height:1.5}
.toets-pick.leveltest{border-color:var(--oranje);background:var(--oranje-soft)}
.goal-panel{padding:18px;gap:10px;max-height:none}
.goal-title{font-family:var(--font-display);font-size:20px;margin:0}
.goal-hint{margin:0;color:var(--ink-2);font-size:14px}
.goal-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 8px}
.goal-opt{flex-direction:column;gap:2px;min-height:64px}
.goal-opt strong{font-family:var(--font-display);font-size:17px;font-weight:700}
.goal-opt span{font-size:13px;color:var(--ink-2)}
.toast{position:fixed;z-index:200;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-140%);max-width:min(92vw,460px);padding:12px 18px;border-radius:var(--r-md);background:var(--be-black);color:#fff;font-weight:900;font-size:15px;text-align:center;box-shadow:0 5px 0 #000,0 18px 40px -12px rgba(0,0,0,.5);transition:transform .35s var(--ease);pointer-events:none}
.toast.show{transform:translate(-50%,0)}
.toast.big{background:var(--oranje);box-shadow:0 5px 0 var(--oranje-deep),0 18px 40px -12px rgba(0,0,0,.5);font-family:var(--font-display);font-weight:700}


/* ---------- verbs in a story (one continuous text, numbered gaps) ---------- */
.vh-title{font-size:clamp(20px,5.5vw,24px)!important;margin:2px 0 6px!important}
.vh-text{width:100%;max-height:30vh;overflow-y:auto;text-align:start;font-size:17px;line-height:1.75;font-weight:700;color:var(--ink);padding:12px 14px;border-radius:var(--r-md);background:var(--surface-2);scroll-behavior:smooth}
.vh-text.full,.vh-text.study{max-height:none}
.vh-s{color:var(--ink-2)}
.vh-s.now{color:var(--ink)}
.vh-plain{color:var(--ink-2)}
.vh-gap{display:inline-block;padding:0 7px;margin:0 1px;border-radius:9px;line-height:1.5;background:var(--surface);border:2px dashed var(--line);color:var(--ink-2);font-weight:800}
.vh-gap.active{border:2px solid var(--oranje);background:var(--oranje-soft);color:var(--oranje-deep);box-shadow:0 3px 0 var(--oranje-deep)}
.vh-gap.filled{border:2px solid transparent;background:var(--ok-soft);color:var(--ok-deep)}
.vh-gap.wrong{border:2px solid transparent;background:var(--bad-soft);color:var(--bad-deep)}
.vh-gap.wrong del{text-decoration-thickness:2px}
.vh-gap.wrong ins{text-decoration:none;color:var(--ok-deep);font-weight:900}
:root[data-theme="dark"] .vh-gap.active{color:#FFB070}
:root[data-theme="dark"] .vh-gap.filled,:root[data-theme="dark"] .vh-gap.wrong ins{color:var(--ok)}
:root[data-theme="dark"] .vh-gap.wrong{color:var(--bad)}
.vh-n{font-size:11px;font-weight:900;margin-inline-end:3px;color:var(--ink-2)}
.vh-inf{font-weight:800;margin-inline-end:2px}
.vh-ask{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 0}
.vh-n.big{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:50%;background:var(--oranje);color:#fff;font-size:14px;margin:0}
.vh-inf2{font-family:var(--font-display);font-weight:700;font-size:20px}
.vh-rules{margin:6px 0 0;padding:0 0 0 18px;text-align:start;font-size:14px;color:var(--ink);font-weight:700}
.vh-rules li{margin:2px 0}
.vh-line{color:var(--ink);cursor:pointer;border-radius:6px}
.vh-line:focus-visible{outline-offset:1px}
.vh-line mark{background:var(--oranje-soft);color:var(--oranje-deep);padding:0 4px;border-radius:6px;font-weight:900}
:root[data-theme="dark"] .vh-line mark{color:#FFB070}
.vh-trline{margin:0;min-height:1.4em;text-align:center;color:var(--ink-2);font-size:14px;font-weight:700}
.vh-end{text-align:start;margin-top:6px}
.vh-end strong{display:block;margin-bottom:8px}

/* ---------- separable verbs ---------- */
.sep-sent .vh-gap{min-width:2.6em;text-align:center}
.sep-inf{display:block;margin-top:4px;font-size:17px;color:var(--ink-2)}
.sep-pair b{font-weight:900}
.sep-pair i{font-style:normal;color:var(--ink-2);margin:0 2px}

/* ---------- "Далі" always reachable above the bottom dock ---------- */
.card .row:has(> #nx:not(:disabled)){position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));z-index:6}
.card .row:has(> #nx:not(:disabled))::before{content:"";position:absolute;inset:-10px -8px -12px;background:linear-gradient(to bottom,transparent,var(--surface) 35%);z-index:-1;border-radius:var(--r-md);pointer-events:none}

/* ---------- compact Kort / lang so word + columns + feedback fit one screen ---------- */
.kl-word{margin:6px 0 2px}
.kl-word .kl-mag{font-size:28px;padding:9px 20px}
.kl-cols{gap:10px}
.kl-col{min-height:112px;padding:10px 6px 12px;gap:4px}
.kl-col h3{font-size:21px}
.kl-list{gap:6px;margin-top:4px}
.feedback .kl-mag{font-size:14px;padding:4px 9px}


/* hover only on devices with a real pointer: on phones a tap leaves :hover stuck on the next button under the finger */
@media (hover:hover) and (pointer:fine){
.theme-btn:hover{background:rgba(60,25,0,.32)}
.nav-cats button:hover{border-color:var(--oranje)}
.nav-subs button:hover{color:var(--ink);background:var(--surface-2)}
.listen:hover{filter:brightness(1.04)}
.opt:hover:not(:disabled){border-color:var(--oranje);background:var(--oranje-soft)}
.btn:hover:not(:disabled){border-color:var(--oranje)}
.btn.primary:hover:not(:disabled){filter:brightness(1.05);border-color:var(--oranje)}
.modes-wrapper button:hover{color:#fff;background:rgba(255,255,255,.08)}
.kl-col:not(:disabled):not(.static):hover{filter:brightness(1.03)}
.report-bug-btn:hover{border-color:var(--oranje)}
.vh-line:hover{text-decoration:underline;text-decoration-color:var(--oranje)}
}
/* ---------- motion ---------- */
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.05)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- RTL (Arabic explanations) ---------- */
[dir="rtl"] .nav-fade-wrap::after{right:auto;left:0;background:linear-gradient(270deg,transparent,var(--bg))}

/* ---------- small phones ---------- */
@media (max-width:420px){
 main{padding:10px 12px 20px;gap:12px}
 .nav-fade-wrap,.sub-wrapper{margin:0 -12px}
 .nav-cats{padding:2px 12px 10px;scroll-padding-inline:12px}.nav-subs{padding:0 12px 2px}
 header{padding:12px 12px 12px 14px;gap:10px}
 .brand h1{font-size:20px}
 .top-right{width:100%;display:grid;grid-template-columns:1fr 1fr auto auto auto;gap:8px}
 .select-group span{display:none}
 .select-group .lang-select{width:100%}
 .kl-rule{grid-template-columns:1fr}
 .opts{gap:10px}
 .opt{min-height:54px;font-size:15px}
}
@media (min-width:700px){
 main{padding-top:24px}
 .card{padding:24px}
}

/* ---------- wide web layout ---------- */
@media (min-width:760px){
 main{max-width:1600px;padding:28px clamp(24px,4vw,64px) 132px;gap:18px}
 .nav-fade-wrap,.sub-wrapper{margin:0}
 .nav-fade-wrap::after{display:none}
 .nav-fade-wrap,.sub-wrapper{min-width:0}
 .nav-cats{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;padding:2px 0 6px;scrollbar-width:none}
 .nav-cats::-webkit-scrollbar,.nav-subs::-webkit-scrollbar{display:none}
 .nav-cats button{scroll-snap-align:start}
 .nav-subs{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:0 0 4px;scrollbar-width:none}
 .progress-panel{width:100%}
 .card{width:min(100%,1200px);margin-inline:auto;padding:28px clamp(24px,4vw,52px)}
 .modes-wrapper{width:min(900px,calc(100% - 64px));gap:8px;padding:8px}
 .modes-wrapper button{flex-direction:row;gap:8px;min-height:58px;padding:8px 12px;font-size:14px}
 .dock-ic{font-size:20px}
 .dock-tx{font-size:13px;white-space:normal;overflow:visible}
 footer{width:min(100%,1120px);margin:18px auto 0;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:8px 18px}
}
@media (min-width:1200px){
 main{padding-top:36px}
 .nav-section{gap:14px}
 .nav-cats{gap:12px}
 .nav-subs{gap:10px}
 .card{padding-top:34px;padding-bottom:34px}
 .opts{gap:16px}
}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><h1 id="appTitle">Leren.be</h1><p id="tagline"></p></div>
    <div class="top-right">
      <label class="select-group"><span id="targetLabel"></span>
        <select id="targetLangPicker" class="lang-select" aria-label="Target language">
          <option value="nl">🇧🇪 BE</option><option value="en">🇬🇧 ENG</option><option value="fr">🇫🇷 FRA</option>
        </select>
      </label>
      <label class="select-group"><span id="uiLabel"></span>
        <select id="uiLangPicker" class="lang-select" aria-label="Explanation language">
          <option value="uk">🇺🇦 UKR</option><option value="en">🇬🇧 ENG</option><option value="fr">🇫🇷 FRA</option><option value="ar">🇸🇦 AR</option>
        </select>
      </label>
      <button class="theme-btn" id="searchBtn" type="button" title="Search">🔍</button>
      <div class="speech-controls">
        <button class="auto-speech-btn" id="autoSpeechToggle" type="button" aria-pressed="false"></button>
        <button class="theme-btn voice-settings-btn" id="voiceSettingsBtn" type="button" aria-label="Voice settings" title="Voice settings">🎙️</button>
        <span id="speechStatus" role="status" aria-live="polite" hidden></span>
      </div>
      <span id="score" class="score-pill" aria-live="polite">⭐ 0</span>
      <button class="theme-btn" id="themeToggle" type="button">🌙</button>
    </div>
  </header>

  <dialog class="voice-dialog" id="voiceDialog" aria-labelledby="voiceDialogTitle">
    <div class="voice-dialog-content">
      <h2 id="voiceDialogTitle"></h2>
      <label id="voiceSelectLabel" for="voicePicker"></label>
      <select id="voicePicker"></select>
      <p id="voiceHint"></p>
      <div class="row">
        <button class="btn" id="voicePreviewBtn" type="button"></button>
        <button class="btn primary" id="voiceCloseBtn" type="button"></button>
      </div>
    </div>
  </dialog>

  <section class="progress-panel" id="progressPanel" aria-label="Progress"></section>
  <span hidden id="progressLabel"></span><span hidden id="learnedCount"></span><span hidden id="reviewCount"></span>

  <div class="nav-section">
    <div class="level-nav" id="levelNav" role="group" aria-label="Level"></div>
    <div class="section-label" id="lblCat">Розділ</div>
    <div class="nav-fade-wrap"><nav class="nav-cats" id="catNav" aria-label="Categories"></nav><div class="nav-scrollbar" id="catSlider" role="scrollbar" aria-controls="catNav" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><span class="nav-scroll-thumb"></span></div></div>
    
    <div class="section-label" id="lblSub">Підрозділ</div>
    <div class="sub-wrapper">
      <nav class="nav-subs" id="subNav" aria-label="Subtopics"></nav>
      <div class="nav-scrollbar" id="subSlider" role="scrollbar" aria-controls="subNav" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><span class="nav-scroll-thumb"></span></div>
    </div>

    <div class="section-label" id="lblMode">Режим</div>
  </div>

  <div class="meta"><span id="prog"></span><span id="rnd"></span></div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="barfill"></i></div>
  <section class="card" id="card" aria-live="polite"></section>
  
  <footer>
    <span id="footText"></span>
    <span>Danylo Hembarskyi • All rights reserved</span>
    <span><a href="mailto:gembarsky.d@gmail.com" style="color:inherit;text-decoration:none">gembarsky.d@gmail.com</a> · <a href="./privacy.html" style="color:inherit">Privacy</a></span>
    <button type="button" id="reportBugBtn" class="report-bug-btn"></button>
    <div class="prog-tools" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px">
      <button type="button" id="exportProgBtn" class="report-bug-btn"></button>
      <button type="button" id="importProgBtn" class="report-bug-btn"></button>
    </div>
  </footer>
</main>

<div id="searchModal" class="search-modal" hidden>
  <div class="search-panel">
    <div class="search-head">
      <input type="search" id="searchInput" placeholder="Zoek een woord…" autocomplete="off" />
      <button type="button" id="searchClose" class="theme-btn">✕</button>
    </div>
    <div id="searchResults" class="search-results"></div>
  </div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const LANGS=["nl","en","fr"],UI_LANGS=["uk","en","fr","ar"],PER_ROUND=10;
const NL_ONLY_TABS=["dehet","klanken","vervoegen"];

function validStored(key,allowed,fallback){try{const v=localStorage.getItem(key);return allowed.includes(v)?v:fallback}catch(e){return fallback}}
function loadNumber(key,fallback){try{const n=Number(localStorage.getItem(key));return Number.isFinite(n)&&n>=0?n:fallback}catch(e){return fallback}}
function loadStore(){try{const v=JSON.parse(localStorage.getItem("poly_progress")||"{}");return v&&typeof v==="object"&&!Array.isArray(v)?v:{}}catch(e){return {}}}

function itemsFor(k=tab){
 if(k==="all"){
  const catObj=CATEGORIES.find(c=>c.id===currentCat);
  const subTabs=catObj?catObj.tabs:[];
  return subTabs.filter(t=>tabVisible(t)&&t!=="klanken").flatMap(t=>DATA[t]?(DATA[t].items||[]):[]);
 }
 return (DATA[k]&&DATA[k].items)||[];
}

const shown=it=>(artOf(it)?artOf(it)+" ":"")+labelFor(it);

function stateFor(id){if(!store[id])store[id]={seen:0,correct:0,wrong:0,streak:0,due:0,known:false};if(typeof store[id].streak!=="number")store[id].streak=0;return store[id]}
const allItems=()=>Object.values(DATA).flatMap(d=>d.items);
function dueItems(){const now=Date.now();return allItems().filter(x=>{const s=stateFor(x.id);return s.seen>0&&s.due<=now})}
const learnedCount=()=>allItems().filter(x=>stateFor(x.id).known).length;

function dailyState(){const d=lsGet("poly_daily",{});return d.d===dayStr()?d:{d:dayStr(),xp:0,done:false}}
function streakState(){const s=lsGet("poly_streak",{n:0,last:""});const live=s.last===dayStr()||s.last===yesterdayStr();return {n:live?s.n:0,last:s.last,today:s.last===dayStr()}}
const dailyGoal=()=>{const g=Number(lsGet("poly_goal",50));return [30,50,100,200].includes(g)?g:50};
// every XP gain goes through here
function addXP(n){
 if(!(n>0))return;
 const before=rankInfo().cur.id;
 score+=n;
 const d=dailyState();d.xp+=n;
 if(!d.done&&d.xp>=dailyGoal()){
  d.done=true;
  const s=lsGet("poly_streak",{n:0,last:""});
  if(s.last!==dayStr()){s.n=(s.last===yesterdayStr()?s.n:0)+1;s.last=dayStr();lsSet("poly_streak",s)}
  toast(pgU().goalDone+" · "+pgU().streak(s.n));
 }
 lsSet("poly_daily",d);
 const after=rankInfo().cur;
 if(after.id!==before)toast(pgU().levelUp(after.name),true);
}

function bindNavSlider(navId,sliderId,labelKey){
 const nav=$(navId),slider=$(sliderId),thumb=slider?.querySelector(".nav-scroll-thumb");
 if(!nav||!slider||!thumb)return;
 const labels={uk:{cats:"Прокрутка розділів",subs:"Прокрутка тем"},en:{cats:"Scroll categories",subs:"Scroll topics"},fr:{cats:"Faire défiler les catégories",subs:"Faire défiler les thèmes"},ar:{cats:"تمرير الفئات",subs:"تمرير المواضيع"}};
 let dragging=false,startX=0,startRatio=0,frame=0;
 const sync=()=>{
  const max=nav.scrollWidth-nav.clientWidth;
  if(max<=2){slider.hidden=true;return}
  slider.hidden=false;
  const width=slider.clientWidth,thumbWidth=Math.min(width,Math.max(36,width*nav.clientWidth/nav.scrollWidth));
  const maxThumb=width-thumbWidth,rtl=getComputedStyle(nav).direction==="rtl",pct=max?Math.max(0,Math.min(1,rtl?1+nav.scrollLeft/max:nav.scrollLeft/max)):0;
  thumb.style.width=thumbWidth+"px";thumb.style.transform="translateX("+(pct*maxThumb)+"px)";
  slider.setAttribute("aria-label",(labels[uiLang]||labels.uk)[labelKey]);
  slider.setAttribute("aria-valuenow",String(Math.round(pct*100)));
  slider.setAttribute("aria-valuetext",Math.round(pct*100)+"%");
 };
 const queueSync=()=>{if(!frame)frame=requestAnimationFrame(()=>{frame=0;sync()})};
 nav.addEventListener("scroll",queueSync,{passive:true});
 window.addEventListener("resize",queueSync);
 new MutationObserver(queueSync).observe(nav,{childList:true});
 slider.addEventListener("pointerdown",e=>{
  if(e.pointerType==="mouse"&&e.button!==0)return;
  e.preventDefault();sync();
  const r=slider.getBoundingClientRect(),tr=thumb.getBoundingClientRect(),max=nav.scrollWidth-nav.clientWidth,travel=r.width-tr.width,rtl=getComputedStyle(nav).direction==="rtl";
  if(max<=0||travel<=0)return;
  slider.setPointerCapture(e.pointerId);dragging=true;startX=e.clientX;startRatio=max?Math.max(0,Math.min(1,rtl?1+nav.scrollLeft/max:nav.scrollLeft/max)):0;
  if(!thumb.contains(e.target)){
   const pct=Math.max(0,Math.min(1,(e.clientX-r.left-tr.width/2)/travel));
   nav.scrollLeft=rtl?(pct-1)*max:pct*max;startRatio=pct;
  }
 });
 slider.addEventListener("pointermove",e=>{
  if(!dragging)return;
  const travel=slider.clientWidth-thumb.offsetWidth,max=nav.scrollWidth-nav.clientWidth,rtl=getComputedStyle(nav).direction==="rtl";
  if(travel>0){const pct=Math.max(0,Math.min(1,startRatio+(e.clientX-startX)/travel));nav.scrollLeft=rtl?(pct-1)*max:pct*max}
 });
 const stopDrag=()=>{dragging=false};
 slider.addEventListener("pointerup",stopDrag);slider.addEventListener("pointercancel",stopDrag);
 slider.addEventListener("keydown",e=>{
  const step=Math.max(100,nav.clientWidth*.35);let left=null;
  if(e.key==="ArrowRight"||e.key==="PageDown")left=step;
  else if(e.key==="ArrowLeft"||e.key==="PageUp")left=-step;
  else if(e.key==="Home")left=-Infinity;
  else if(e.key==="End")left=Infinity;
  if(left===null)return;e.preventDefault();
  const max=nav.scrollWidth-nav.clientWidth,rtl=getComputedStyle(nav).direction==="rtl";
  const pct=max?Math.max(0,Math.min(1,rtl?1+nav.scrollLeft/max:nav.scrollLeft/max)):0;
  const target=left===-Infinity?(rtl?1:0):left===Infinity?(rtl?0:1):Math.max(0,Math.min(1,pct+left/Math.max(1,max)));
  nav.scrollTo({left:rtl?(target-1)*max:target*max,behavior:"smooth"});
 });
 sync();
}

let speechToken=0;
function say(text,button){
 try{
  if(!("speechSynthesis" in window)||!("SpeechSynthesisUtterance" in window)){showSpeechNote();return}
  const synth=window.speechSynthesis,token=++speechToken;
  if(synth.speaking||synth.pending)synth.cancel();
  updateSpeechState(false);
  const u=new SpeechSynthesisUtterance(String(text||""));
  u.lang=speechLang();u.rate=.75;u.volume=1;
  const voices=speechVoices.length?speechVoices:(refreshSpeechVoices(),speechVoices),pre=u.lang.toLowerCase().split("-")[0];
  const saved=lsGet("leren_voice_"+targetLang,"");
  const v=voices.find(x=>speechVoiceKey(x)===saved)||voices.find(x=>x.lang.toLowerCase()===u.lang.toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(pre));
  if(voices.length&&!v){showSpeechNote();return}
  if(v){u.voice=v;u.lang=v.lang}
  u.onstart=()=>{if(token===speechToken)updateSpeechState(true,button)};
  const done=()=>{if(token===speechToken)updateSpeechState(false)};
  u.onend=done;
  u.onerror=e=>{done();if(!["interrupted","canceled","not-allowed"].includes(e.error))showSpeechNote()};
  synth.speak(u);
 }catch(e){updateSpeechState(false);showSpeechNote()}
}

 if(tab==="dehet"&&artOf(cur)){
  const arts=["de","het"];
  return shuffle(arts.map(l=>({label:l,ok:l===artOf(cur),t:true})));
 }
 const f=mode==="audio"?meaningFor:labelFor,g=mode==="audio"?labelFor:meaningFor,t=mode!=="audio",correct=f(cur),seen=new Set([correct]),out=[];
 // Skip distractors that would also be a correct answer (same prompt text)
 for(const x of shuffle(itemsFor().filter(x=>x.id!==cur.id&&g(x)!==g(cur)))){
  const v=f(x);
  if(!seen.has(v)){seen.add(v);out.push({label:v,ok:false,c:x.c,t});if(out.length>=3)break}
 }
 out.push({label:correct,ok:true,c:cur.c,t});
 return shuffle(out);
}

function renderClockFace(nlText){
 const wrap=el("div","clock-visual");
 wrap.appendChild(el("div","clock-center"));
 let hAngle=0, mAngle=0;
 const t = String(nlText).toLowerCase();
 if(t.includes("twaalf uur")){hAngle=0;mAngle=0;}
 else if(t.includes("een uur")){hAngle=30;mAngle=0;}
 else if(t.includes("drie uur")){hAngle=90;mAngle=0;}
 else if(t.includes("vijf uur")){hAngle=150;mAngle=0;}
 else if(t.includes("zeven uur")){hAngle=210;mAngle=0;}
 else if(t.includes("negen uur")){hAngle=270;mAngle=0;}
 else if(t.includes("tien uur")){hAngle=300;mAngle=0;}
 else if(t.includes("half twee")){hAngle=45;mAngle=180;}
 else if(t.includes("half vier")){hAngle=105;mAngle=180;}
 else if(t.includes("half zes")){hAngle=165;mAngle=180;}
 else if(t.includes("half acht")){hAngle=225;mAngle=180;}
 else if(t.includes("kwart over twee")){hAngle=67.5;mAngle=90;}
 else if(t.includes("kwart over acht")){hAngle=247.5;mAngle=90;}
 else if(t.includes("kwart voor drie")){hAngle=82.5;mAngle=270;}
 else if(t.includes("kwart voor tien")){hAngle=292.5;mAngle=270;}
 else{hAngle=0;mAngle=0;}

 const handH=el("div","clock-hand-h");handH.style.transform=`rotate(${hAngle}deg)`;
 const handM=el("div","clock-hand-m");handM.style.transform=`rotate(${mAngle}deg)`;
 wrap.append(handH,handM);
 return wrap;
}

function vhNewRound(){
 vhAns={};const st=vhCur();
 if(mode==="study"){vhRenderStudy();return}
 let list=st.gaps.map(g=>({g,id:vhId(st,g)}));
 if(mode==="review"){const now=Date.now();list=list.filter(x=>{const s=stateFor(x.id);return s.seen>0&&s.due<=now})}
 if(!list.length){renderEmpty();const c=$("card");c.insertBefore(vhBar(),c.firstChild);return}
 // gaps that are not asked this round are shown already filled
 const asked=new Set(list.map(x=>x.g.n));st.gaps.forEach(g=>{if(!asked.has(g.n))vhAns[g.n]={w:g.ok,ok:true,pre:true}});
 deck=list.slice().reverse();roundTotal=deck.length; // keep story order (deck.pop takes from the end)
 nextQuestion();
}
// the whole story as one text; cur = number of the active gap
function vhText(st,cur){
 const box=el("div","vh-text");tgt(box);
 st.items.forEach(it=>{
  if(!it.v){box.append(el("span","vh-plain",it.t+" "));return}
  const [a,b]=it.s.split("___");const sent=el("span","vh-s"+(it.n===cur?" now":""));
  sent.append(a);
  const ans=vhAns[it.n];
  const gap=el("span","vh-gap"+(it.n===cur?" active":"")+(ans?(ans.ok?" filled":" wrong"):""));
  gap.append(el("sup","vh-n",String(it.n)));
  if(ans){if(ans.ok)gap.append(ans.w);else gap.append(el("del","",ans.w)," ",el("ins","",it.ok))}
  else gap.append(el("span","vh-inf","("+it.v+")"),"…");
  sent.append(gap,b+" ");box.appendChild(sent);
 });
 return box;
}

function vhAnswer(ok,btn){

 if(ok){const x=xpForCorrect(s);right++;roundPoints+=x;addXP(x);s.correct++;s.streak++;s.due=Date.now()+(s.streak>=3?3:1)*864e5}
 else{s.wrong++;s.streak=0;s.due=Date.now()}
 s.known=s.streak>=2;saveStore();updateStats();

const sepFill=d=>{const [a,b,c]=d.s.split("___");return a+d.v+b+d.p+c};
function sepNext(){
 locked=false;item=deck.pop();q++;sessionIds.push(item.id);
 const d=SEP[item.id];if(!d){nextQuestion();return}
 const n=sepU().none;
 item.sep=d;
 item.opts=shuffle([
  {a:d.v,b:d.p,ok:true},
  {a:d.p+d.v,b:n,ok:false},          // not split: "opsta"
  {a:(()=>{const inf=item.nl.split("→")[0].trim();return inf===d.p+d.v?d.p+d.w:inf})(),b:n,ok:false}, // infinitive (or "opruimt" when it equals the unsplit form)
  {a:d.w,b:d.p,ok:false}             // wrong ending
 ]);
 sepRender();
 if(mode==="audio")autoSay(item.nl.split("→")[0].trim());
}
function sepRender(){
 const u=getUI(),d=item.sep;
 $("prog").textContent=u.lessonProgress+" "+q+" / "+roundTotal;$("rnd").textContent=u.round+" "+round+" · "+u.modes[mode];updateProgress();
 const card=$("card");card.replaceChildren();
 const top=el("div","q");top.appendChild(el("small","",sepU().sub));
 if(item.icon)top.appendChild(iconBox(item.icon));
 const [a,b,c]=d.s.split("___");
 const h=el("h2","vh-sent sep-sent");tgt(h);
 h.append(a,el("span","vh-gap"+(locked?" filled":" active"),locked?d.v:"1"),b,el("span","vh-gap"+(locked?" filled":" active"),locked?d.p:"2"),c);
 top.appendChild(h);
 const inf=el("span","vh-inf2 sep-inf","("+item.nl.split("→")[0].trim()+")");tgt(inf);top.appendChild(inf);
 const hear=el("button","listen",u.repeat||u.listen);hear.type="button";hear.onclick=()=>say(locked?sepFill(d):item.nl.split("→")[0].trim(),hear);top.appendChild(hear);
 card.appendChild(top);
 const opts=el("div","opts sep-opts");
 item.opts.forEach(o=>{const bt=el("button","opt");bt.type="button";bt.dataset.ok=o.ok?"1":"";
  const t=el("span","sep-pair");tgt(t);t.append(el("b","",o.a),el("i",""," … "),el("b","",o.b));bt.appendChild(t);
  bt.disabled=locked;bt.onclick=()=>sepAnswer(o.ok,bt);opts.appendChild(bt)});
 card.appendChild(opts);
 const fb=el("div","feedback");fb.id="feedback";card.appendChild(fb);
 const row=el("div","row"),nx=el("button","btn primary",u.next);nx.type="button";nx.id="nx";nx.disabled=!locked;nx.onclick=nextQuestion;row.appendChild(nx);card.appendChild(row);
}
function sepAnswer(ok,btn){
 if(locked)return;locked=true;
 const u=getUI(),d=item.sep,s=stateFor(item.id);s.seen++;
 if(ok){const x=xpForCorrect(s);right++;roundPoints+=x;addXP(x);s.correct++;s.streak++;s.due=Date.now()+(s.streak>=3?3:1)*864e5}
 else{s.wrong++;s.streak=0;s.due=Date.now()}
 s.known=s.streak>=2;saveStore();updateStats();
 const idx=[...btn.parentNode.children].indexOf(btn);
 sepRender();
 document.querySelectorAll("#card .opt").forEach((b,i)=>{if(b.dataset.ok==="1")b.classList.add("correct");else if(!ok&&i===idx)b.classList.add("incorrect")});
 const fb=$("feedback");fb.appendChild(el("strong","",ok?u.correct:u.incorrect));
 const full=el("p","example",sepFill(d));tgt(full);fb.appendChild(full);
 fb.appendChild(el("p","",d[uiLang]||d.en));
 fb.appendChild(el("p","xp-note",sepU().rule));
}

function startToets(){
  // Neutralize category highlight — toets is independent of topic tabs
  document.querySelectorAll("#catNav button").forEach(b=>b.setAttribute("aria-selected","false"));
  document.querySelectorAll("#subNav button").forEach(b=>b.setAttribute("aria-selected","false"));
  const u = getUI();
  const card = $("card");
  card.replaceChildren();
  $("prog").textContent = "";
  $("rnd").textContent = u.modes.toets || "Toets A1";
  $("barfill").style.width = "0%";
  const title = el("div","q");
  title.appendChild(el("h2","",u.toetsChoose || "Обери тест"));
  card.appendChild(title);
  TOETS.filter(t => (t.lvl||"a11") === curLevel && !(t.kind==="leveltest" && levelUnlocked(t.unlocks))).forEach(t => {
    const b = el("button","btn toets-pick"+(t.kind==="leveltest"?" leveltest":""));
    b.type = "button";
    const best = lsGet("poly_toetsbest",{})[t.id];
    b.textContent = (t.title[uiLang] || t.title.en || t.id) + " (" + t.questions.length + ")" + (best!=null ? " · ★ " + best + "/" + t.questions.length : "");
    b.onclick = () => {
      toetsId = t.id;
      toetsQ = 0;
      toetsRight = 0;
      toetsLocked = false;
      nextToetsQuestion();
    };
    card.appendChild(b);
  });
}

function nextToetsQuestion(){
  cardToTop();
  const test = TOETS.find(t => t.id === toetsId);
  if(!test){ startToets(); return; }
  if(toetsQ >= test.questions.length){ endToets(); return; }
  toetsLocked = false;
  const item = test.questions[toetsQ];
  const u = getUI();
  $("prog").textContent = (u.toetsQ||"Питання") + " " + (toetsQ+1) + " " + (u.toetsOf||"з") + " " + test.questions.length;
  $("rnd").textContent = (test.title[uiLang] || test.title.en);
  const pct = Math.round(toetsQ / test.questions.length * 100);
  $("barfill").style.width = pct + "%";
  $("barfill").parentElement.setAttribute("aria-valuenow", String(pct));

  const card = $("card");
  card.replaceChildren();
  const top = el("div","q");

  if(item.type === "read" && item.text){
    const txt = el("p","toets-text", item.text); tgt(txt);
    top.appendChild(txt);
  }

  const qText = item.q[uiLang] || item.q.en || item.q.uk || "";
  top.appendChild(el("small","", qText));

  if(item.type === "gap" && item.sentence){
    const sent = el("h2","", item.sentence.replace("___","______"));
    sent.style.marginTop = "8px";
    top.appendChild(tgt(sent));
  }

  card.appendChild(top);

  const opts = el("div","opts");
  card.appendChild(opts);
  const fb = el("div","feedback");
  fb.id = "feedback";
  card.appendChild(fb);
  const row = el("div","row");
  const nx = el("button","btn primary", u.toetsNext || u.next || "Далі");
  nx.type = "button";
  nx.disabled = true;
  nx.id = "nx";
  nx.onclick = () => { toetsQ++; nextToetsQuestion(); };
  row.appendChild(nx);
  card.appendChild(row);

  const optLabel = (opt) => {
    if (opt && typeof opt === "object") return opt[uiLang] || opt.en || opt.uk || Object.values(opt)[0] || "";
    return String(opt ?? "");
  };
  shuffle((item.opts || []).map((opt, i) => ({opt, i}))).forEach(({opt, i}) => {
    const b = el("button","opt");
    b.type = "button";
    b.dataset.ok = (i === item.ok) ? "1" : "";
    const label = optLabel(opt);
    const t = el("span","", label);
    if(item.type === "gap") tgt(t); // Dutch gap words only
    b.appendChild(t);
    b.onclick = () => answerToets(i === item.ok, b, item);
    opts.appendChild(b);
  });
}

function answerToets(ok, btn, item){
  if(toetsLocked) return;
  toetsLocked = true;
  const u = getUI();
  if(ok) toetsRight++;
  document.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    if(b.dataset.ok === "1") b.classList.add("correct");
  });
  if(!ok) btn.classList.add("incorrect");
  const fb = $("feedback");
  fb.replaceChildren();
  fb.appendChild(el("strong","", ok ? (u.correct||"Правильно!") : (u.incorrect||"Неправильно.")));
  if(!ok && item.opts){
    const ans = item.opts[item.ok];
    const label = (ans && typeof ans === "object") ? (ans[uiLang]||ans.en||ans.uk||"") : String(ans??"");
    fb.appendChild(el("p","example", label));
  }
  const nx = $("nx");
  if(nx) nx.disabled = false;
  if(nx) setTimeout(() => nx.scrollIntoView({behavior:"smooth", block:"nearest"}), 100);
}

function endToets(){
  const test = TOETS.find(t => t.id === toetsId);
  const total = test ? test.questions.length : 0;
  const pct = total ? Math.round(toetsRight / total * 100) : 0;
  const u = getUI();
  $("barfill").style.width = "100%";
  const card = $("card");
  card.replaceChildren();
  const end = el("div","end");
  const pg = pgU(), passMark = (test && test.pass) || 70, passed = pct >= passMark;
  const bestMap = lsGet("poly_toetsbest",{}), prev = test ? (bestMap[test.id]||0) : 0;
  const gain = Math.max(0, toetsRight - prev) * 10;
  if(test && toetsRight > prev){ bestMap[test.id] = toetsRight; lsSet("poly_toetsbest", bestMap); }
  let unlockedNow = null;
  if(test && test.kind === "leveltest" && passed){
    const un = lsGet("poly_unlocked",[]); if(!un.includes(test.unlocks)){ un.push(test.unlocks); lsSet("poly_unlocked", un); }
    unlockedNow = levelById(test.unlocks);
  }
  addXP(gain); saveStore(); updateStats();
  if(unlockedNow) toast(pg.passedLT(unlockedNow.name), true);
  end.appendChild(el("h2","", toetsRight + " / " + total));
  end.appendChild(el("p","", pct + "% · " + (passed ? (u.toetsPassed||"Склав!") : (u.toetsFailed||"Ще практика"))));
  end.appendChild(el("p","xp-note", unlockedNow ? pg.passedLT(unlockedNow.name) : (test && test.kind==="leveltest" && !passed) ? pg.ltNeed(passMark) : gain > 0 ? pg.newBest(gain) : pg.bestOnly(prev + "/" + total)));
  const grid = el("div","summary-grid");
  [[u.right||"Правильні", toetsRight],[u.points||"Балів", "+"+gain],[u.toetsScore||"Результат", pct+"%"]].forEach(([l,v])=>{
    const d = el("div"); d.append(el("strong","",v), el("span","",l)); grid.appendChild(d);
  });
  end.appendChild(grid);
  const row = el("div","row");
  const again = el("button","btn", u.toetsAgain || "Ще раз");
  again.type = "button";
  again.onclick = () => { toetsQ=0; toetsRight=0; nextToetsQuestion(); };
  row.appendChild(again);
  const back = el("button","btn primary", unlockedNow ? "→ " + unlockedNow.name : (u.toetsBack || "До тестів"));
  back.type = "button";
  back.onclick = unlockedNow ? () => { curLevel = unlockedNow.id; const c = levelCats()[0]; currentCat = c.id; tab = c.tabs.find(tabVisible)||"all"; mode = "quiz"; saveStore(); updateModeButtons(); buildNav(); newRound(); } : startToets;
  row.appendChild(back);
  end.appendChild(row);
  card.appendChild(end);
}

const SENT=Object.entries(BUILD_BANK).flatMap(([cat,rows])=>(rows||[]).filter(r=>Array.isArray(r)&&typeof r[1]==="string").map(r=>({cat,level:r[0],q:r[1].split("|"),roles:String(r[2]||"").replace(/\s/g,""),uk:r[3],en:r[4],fr:r[5],ar:r[6],x:r[7],again:false}))); 
let bAudio=false,bs=null,buildLevel=Number(validStored("poly_buildLevel",["1","2"],"1"))||1;
if(![1,2].includes(buildLevel))buildLevel=1;
const sentence=s=>{const t=s.q.join(" ");return t[0].toUpperCase()+t.slice(1)+"?"};

function nextBuild(){
 locked=false;const s=deck.pop();q++;sessionIds.push("b"+q);
 // Richer decoys for higher levels: fixed + random words from other sentences
 const fixedDecoys=buildLevel===1?[]:["misschien","graag","altijd","vandaag"];
 let extraPool=[];
 if(buildLevel>=2){
  SENT.filter(x=>x.cat===currentCat&&x!==s).forEach(x=>x.q.forEach(w=>{if(!s.q.includes(w)&&!fixedDecoys.includes(w))extraPool.push(w)}));
  extraPool=shuffle([...new Set(extraPool)]).slice(0,2);
 }
 const decoys=fixedDecoys.concat(extraPool);
 const extras=(s.x?[s.x]:[]).concat(decoys).filter((w,i,a)=>!s.q.includes(w)&&a.indexOf(w)===i);
 const tiles=shuffle(s.q.map(w=>({w})).concat(extras.map(w=>({w}))));
 bs={s,tiles,slots:s.q.map(()=>null),stars:3,lock:false,done:false,bad:[]};
 renderBuild();if(bAudio)say(sentence(s));
}
function placeTile(t){
 if(bs.done||bs.lock)return;
 const k=bs.slots.indexOf(null);if(k<0)return;
 bs.slots[k]=t;afterPlace();
}
function clearSlot(k){if(bs.done||bs.lock||!bs.slots[k])return;bs.slots[k]=null;bs.bad=[];renderBuild()}
function afterPlace(){if(bs.slots.every(Boolean))checkBuild();else renderBuild()}
function checkBuild(){
 const cur=bs,bad=cur.s.q.map((w,k)=>cur.slots[k].w===w?-1:k).filter(k=>k>=0);
 if(!bad.length){finishBuild();return}
 cur.stars=Math.max(1,cur.stars-1);cur.bad=bad;cur.lock=true;renderBuild();
 setTimeout(()=>{if(bs!==cur||cur.done)return;bad.forEach(k=>{cur.slots[k]=null});cur.bad=[];cur.lock=false;renderBuild()},850);
}
function hintBuild(){
 if(bs.done||bs.lock)return;
 const {s,slots,tiles}=bs,k=s.q.findIndex((w,i)=>!slots[i]||slots[i].w!==w);if(k<0)return;
 const t=tiles.find(x=>x.w===s.q[k]),j=slots.indexOf(t);if(j>=0)slots[j]=null;
 slots[k]=t;bs.stars=Math.max(1,bs.stars-1);bs.bad=[];afterPlace();
}
function finishBuild(){
 const cur=bs,s=cur.s;cur.done=true;locked=true;
 if(!s.again){
  const pts=cur.stars===3?10:cur.stars===2?7:4;addXP(pts);roundPoints+=pts;
  if(cur.stars===3)right++;else{s.again=true;deck.unshift(s);roundTotal++}
  saveStore();updateStats();
 }
 renderBuild();
 say(sentence(s));
 setTimeout(()=>{
  const nx=$("nx");
  if(nx)nx.scrollIntoView({behavior:"smooth",block:"nearest"});
 },100);
}
function renderBuild(){
 const u=getUI(),s=bs.s;
 $("prog").textContent=u.lessonProgress+" "+q+" / "+roundTotal;$("rnd").textContent=u.round+" "+round+" · "+u.build;updateProgress();
 const card=$("card");card.replaceChildren();
 const levelBar=el("div","row build-levels");levelBar.style.justifyContent="center";levelBar.style.marginBottom="10px";levelBar.setAttribute("aria-label",u.buildLevel);[1,2].forEach(lv=>{const lb=el("button","btn"+(buildLevel===lv?" primary":""),u.buildLevel+" "+lv);lb.type="button";lb.setAttribute("aria-pressed",String(buildLevel===lv));lb.onclick=()=>{if(buildLevel!==lv){buildLevel=lv;newRound()}};levelBar.appendChild(lb)});card.replaceChildren(levelBar);
 const top=el("div","q");top.appendChild(el("small","",u.buildSub));
 if(bAudio&&!bs.done)top.appendChild(el("div","icon-box","🔊"));else top.appendChild(el("h2","sm",s[uiLang]||s.en));
 const tools=el("div","row");tools.style.justifyContent="center";
 const hear=el("button","listen",u.repeat||u.listen);hear.type="button";hear.onclick=()=>say(sentence(s));
 const ear=el("button","listen",(bAudio?"✓ ":"")+u.byEar);ear.type="button";
 ear.onclick=()=>{bAudio=!bAudio;renderBuild();if(bAudio&&!bs.done)say(sentence(s))};
 tools.append(hear,ear);top.appendChild(tools);card.appendChild(top);
 const slots=el("div","slots");
 s.roles.split("").forEach((r,k)=>{
  const w=el("div","sw2 r"+r);w.appendChild(el("span","role",u.roles[r]));
  const t=bs.slots[k],b=el("button","slot"+(t?" filled":"")+(bs.bad.includes(k)?" bad":"")+(bs.done?" good":""),t?t.w:"");
  b.type="button";if(t)tgt(b);b.onclick=()=>clearSlot(k);w.appendChild(b);slots.appendChild(w);
 });
 card.appendChild(slots);
 const bank=el("div","bank");
 if(!bs.done)bs.tiles.filter(t=>!bs.slots.includes(t)).forEach(t=>{const b=el("button","opt tile",t.w);tgt(b);b.type="button";b.onclick=()=>placeTile(t);bank.appendChild(b)});
 card.appendChild(bank);
 const fb=el("div","feedback");fb.id="feedback";
 if(bs.done){fb.appendChild(el("strong","","⭐".repeat(bs.stars)+" "+u.correct));fb.appendChild(tgt(el("p","example",sentence(s))));fb.appendChild(el("p","",s[uiLang]||s.en))}
 card.appendChild(fb);
 const row=el("div","row");
 if(bs.done){const nx=el("button","btn primary",u.next);nx.type="button";nx.id="nx";nx.onclick=nextQuestion;row.appendChild(nx)}
 else{const h=el("button","btn",u.hint);h.type="button";h.disabled=bs.lock;h.onclick=hintBuild;row.appendChild(h)}
 card.appendChild(row);
}

// --- Mini translator / word search ---
function allVocab(){
  const out=[];
  Object.keys(DATA).forEach(k=>{
    const block=DATA[k];
    if(block&&Array.isArray(block.items)){
      block.items.forEach(it=>{
        if(it&&it.nl) out.push(it);
      });
    }
  });
  return out;
}
function openSearch(){
  const u=getUI();
  const modal=$("searchModal");
  const inp=$("searchInput");
  if(!modal||!inp) return;
  modal.hidden=false;
  inp.placeholder=u.searchPh||"Zoek een woord…";
  inp.value="";
  $("searchResults").replaceChildren();
  inp.focus();
}
function closeSearch(){
  const modal=$("searchModal");
  if(modal) modal.hidden=true;
}
function runSearch(){
  const u=getUI();
  const q=($("searchInput").value||"").trim().toLowerCase();
  const box=$("searchResults");
  box.replaceChildren();
  if(q.length<1){return;}
  const lang=uiLang==="uk"?"uk":uiLang==="fr"?"fr":uiLang==="ar"?"ar":"en";
  const hits=allVocab().filter(it=>{
    const fields=[it.nl,it.en,it.fr,it.uk,it.ar,it.ex_nl,it.ex_uk].filter(Boolean).map(s=>String(s).toLowerCase());
    return fields.some(f=>f.includes(q));
  }).slice(0,30);
  if(!hits.length){
    box.appendChild(el("div","search-empty",u.searchEmpty||"Nothing found"));
    return;
  }
  hits.forEach(it=>{
    const div=el("div","search-item");
    const nl=el("div","nl",it.nl||"");
    div.appendChild(nl);
    const tr=el("div","tr",(it[lang]||it.en||it.uk||""));
    div.appendChild(tr);
    if(it.ex_nl){
      const ex=el("div","ex",it.ex_nl+(it.ex_uk?" — "+it.ex_uk:""));
      div.appendChild(ex);
    }
    div.addEventListener("click",()=>{ if(it.nl) say(it.nl); });
    box.appendChild(div);
  });
}
$("searchBtn")&&$("searchBtn").addEventListener("click",openSearch);
$("searchClose")&&$("searchClose").addEventListener("click",closeSearch);
$("searchModal")&&$("searchModal").addEventListener("click",e=>{ if(e.target===$("searchModal")) closeSearch(); });
$("searchInput")&&$("searchInput").addEventListener("input",runSearch);
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeSearch(); const gm=$("goalModal"); if(gm) gm.hidden=true; } });

 document.documentElement.dataset.theme=n;

});

function start(){
 try{
  const t=localStorage.getItem("poly_theme");
  document.documentElement.dataset.theme=(t==="dark"||t==="glass")?"dark":"light"; // old "glass" was a dark look
 }catch(e){document.documentElement.dataset.theme="light"}
 updateHeader();buildNav();bindNavSlider("catNav","catSlider","cats");bindNavSlider("subNav","subSlider","subs");newRound();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", start);
} else {
  start();
}
