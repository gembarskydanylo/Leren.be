<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD23F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Polyglot Leren — Oranje Pop</title>
<style>
:root{color-scheme:light;--bg:#F2F4F8;--fg:#1E2238;--mut:#656C85;--card:#FFFFFF;--line:#E2E6F0;--acc:#4657D9;--acc-hover:#3545c4;--ok:#1F8A53;--ok-bg:#EBF7F0;--bad:#D93D4A;--bad-bg:#FDF0F1;--soft:#EBF0FF;--shadow:0 4px 20px rgba(30,34,56,.05);--amb:#B7791F}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0F111A;--fg:#F0F2FA;--mut:#98A0B8;--card:#1A1D2A;--line:#2A2E40;--acc:#7B8BFF;--acc-hover:#93A0FF;--ok:#50D086;--ok-bg:#163324;--bad:#FF737C;--bad-bg:#381C23;--soft:#232845;--shadow:0 4px 20px rgba(0,0,0,.25);--amb:#E5B567}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,select{font:inherit}
button:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{touch-action:manipulation}
main{width:100%;max-width:720px;margin:0 auto;padding:8px 8px 16px;display:flex;flex-direction:column;gap:8px}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;background:var(--card);padding:8px 10px;border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow)}
.brand h1{font-size:16px;line-height:1.1;margin:0;letter-spacing:-.03em;font-weight:800}
.brand p{margin:1px 0 0;color:var(--mut);font-size:10px}
.top-right{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.select-group{display:flex;align-items:center;gap:2px;color:var(--mut);font-size:10px}
.lang-select,.theme-btn{background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:6px;min-height:28px;padding:2px 4px;font-size:11px;font-weight:600}
.theme-btn{cursor:pointer;min-width:30px;text-align:center}
.score-pill{border:1px solid var(--line);background:var(--soft);color:var(--acc);border-radius:6px;padding:3px 6px;font-size:11px;font-weight:800;white-space:nowrap}

/* Статистика */
.stats-bar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11px;color:var(--mut)}
.stats-bar strong{color:var(--fg);font-weight:700}

/* Навігація */
.nav-section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.section-label{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:800;margin-bottom:-4px;padding-left:2px}

/* 1 Рівень: Розділи */
.nav-cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.nav-cats::-webkit-scrollbar{display:none}
.nav-cats button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--mut);cursor:pointer;white-space:nowrap;flex-shrink:0;font-size:12px;font-weight:700}
.nav-cats button[aria-selected="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}

/* 2 Рівень: Підрозділи */
.sub-wrapper{background:var(--bg);border-radius:8px;padding:4px;border:1px solid var(--line)}
.nav-subs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav-subs::-webkit-scrollbar{display:none}
.nav-subs button{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--mut);cursor:pointer;white-space:nowrap;flex-shrink:0;font-size:11px;font-weight:600}
.nav-subs button[aria-selected="true"]{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:750}

/* 3 Рівень: Режими гри */
.modes-wrapper{background:var(--line);border-radius:8px;padding:3px;display:flex;gap:4px}
.modes-wrapper button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 2px;color:var(--mut);font-size:11px;font-weight:700;cursor:pointer;text-align:center;white-space:nowrap}
.modes-wrapper button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}

.meta{display:flex;justify-content:space-between;gap:6px;color:var(--mut);font-size:10px;font-weight:600;padding:0 2px}
.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}

/* Картка */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0}
.q{text-align:center}
.q small{color:var(--mut);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:800}
.icon-box{font-size:36px;margin:2px 0 0;line-height:1}
.q h2{font-size:clamp(18px,4vw,24px);font-weight:800;margin:2px 0;letter-spacing:-.03em;overflow-wrap:anywhere}
.q p{margin:0;color:var(--mut);font-size:12px}
.listen{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:14px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;margin-top:4px;min-height:30px}

/* Циферблат годинника */
.clock-visual{width:90px;height:90px;border-radius:50%;background:var(--bg);border:2px solid var(--acc);margin:4px auto 2px;position:relative;display:flex;align-items:center;justify-content:center}
.clock-center{width:6px;height:6px;background:var(--acc);border-radius:50%;position:absolute;z-index:3}
.clock-hand-h{width:2px;height:26px;background:var(--fg);position:absolute;bottom:45px;left:44px;border-radius:2px;transform-origin:bottom center;z-index:2}
.clock-hand-m{width:1.5px;height:36px;background:var(--acc);position:absolute;bottom:45px;left:44.25px;border-radius:2px;transform-origin:bottom center;z-index:1}

/* Варіанти відповідей */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.opt{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:8px 6px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;text-align:center;min-height:40px;overflow-wrap:anywhere}
.opt.correct{background:var(--ok-bg)!important;color:var(--fg)!important;font-weight:700;border-width:2px!important}
.opt.incorrect{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.swatch{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);flex-shrink:0}

.feedback{border-radius:8px;padding:6px 8px;text-align:center;background:var(--bg);border:1px solid var(--line)}
.feedback:empty{display:none}
.feedback strong{display:block;font-size:13px}
.feedback p{margin:1px 0 0;color:var(--mut);font-size:11px}
.feedback .example{margin-top:2px;color:var(--fg);font-weight:600}

.row{display:flex;gap:6px;flex-wrap:wrap}
.btn{flex:1;min-width:90px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-weight:700;cursor:pointer;text-align:center;min-height:36px;font-size:12px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}

.end{text-align:center;display:flex;flex-direction:column;gap:8px}
.end h2{font-size:26px;margin:0}
.end p{color:var(--mut);margin:0;font-size:12px}
.summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.summary-grid div{padding:6px 2px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.summary-grid strong{display:block;font-size:14px}
.summary-grid span{font-size:9px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:8px;font-size:12px}

footer{text-align:center;color:var(--mut);font-size:10px;margin-top:4px;display:flex;flex-direction:column;gap:2px}
footer strong{color:var(--fg);font-weight:750}

.q h2.sm{font-size:16px}
.slots,.bank{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;direction:ltr}
.bank{min-height:34px}
.sw2{display:flex;flex-direction:column;align-items:center;gap:1px}
.sw2.rQ{--rc:var(--acc)}.sw2.rV{--rc:var(--ok)}.sw2.rS{--rc:var(--amb)}.sw2.rR{--rc:var(--mut)}
.role{font-size:8px;letter-spacing:.05em;text-transform:uppercase;font-weight:800;color:var(--rc)}
.slot{min-width:46px;min-height:32px;padding:3px 4px;border-radius:6px;border:1px dashed var(--line);border-bottom:2px solid var(--rc);background:var(--bg);color:var(--fg);font:inherit;font-weight:600;font-size:12px;cursor:pointer}
.slot.filled{border-style:solid;background:var(--card)}
.slot.bad{border-color:var(--bad);border-bottom-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.slot.good{border-color:var(--ok);border-bottom-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.tile{min-height:32px;padding:4px 8px;font-size:12px}

@style id="theme-oranje"{
:root{--bg:#FFF3E0;--fg:#2A1A0C;--mut:#7A5A3A;--card:#FFFFFF;--line:#F3D3A8;--acc:#C94600;--acc-hover:#A93A00;--ok:#1E8E4E;--ok-bg:#DFF5E6;--bad:#D32F2F;--bad-bg:#FFE3E0;--soft:#FFE2B8;--shadow:0 3px 0 rgba(120,70,10,.12);--amb:#B26A00;--pop:#FF8A1F;--hdr:#FFD23F}
:root[data-theme="dark"]{--bg:#1D130C;--fg:#FFF1E0;--mut:#D9B38A;--card:#2C1D12;--line:#4D3420;--acc:#FFA64D;--acc-hover:#FFB871;--ok:#5BE08F;--ok-bg:#163A25;--bad:#FF8480;--bad-bg:#40201F;--soft:#4A3015;--shadow:0 3px 0 rgba(0,0,0,.35);--pop:#FFA64D;--hdr:#3A2614}
body{font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,sans-serif;font-size:14px;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:var(--hdr);border:0;border-radius:16px;box-shadow:0 3px 0 rgba(120,70,10,.2);padding:8px 12px}
.brand h1{font-size:17px;font-weight:900}
.lang-select,.theme-btn,.score-pill{background:var(--card);color:var(--fg);border:1.5px solid var(--line);border-radius:8px;box-shadow:none;font-weight:800;min-height:28px;font-size:11px}
.stats-bar,.nav-section,.card{border-radius:14px;border:1.5px solid var(--line);box-shadow:var(--shadow)}
.sub-wrapper{border:0;background:transparent;padding:0}.section-label{display:none}
.nav-cats button,.nav-subs button{border-radius:10px;border:1.5px solid var(--line);border-bottom-width:3px;font-weight:800;box-shadow:none;padding:5px 8px;font-size:11px}
.nav-cats button[aria-selected="true"],.nav-subs button[aria-selected="true"]{background:var(--pop);border-color:#C96A00;color:#2A1A0C}
.modes-wrapper{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(6px + env(safe-area-inset-bottom));width:calc(100% - 12px);max-width:704px;z-index:30;border-radius:16px;background:var(--card);border:1.5px solid var(--line);box-shadow:0 4px 0 rgba(120,70,10,.15),0 8px 20px rgba(0,0,0,.12);padding:4px}
.modes-wrapper button{border:0;background:transparent;border-radius:10px;min-height:38px;font-weight:800;color:var(--mut);font-size:11px}
.modes-wrapper button.primary{background:var(--pop);color:#2A1A0C}
.opt{border:1.5px solid var(--line);border-bottom-width:3.5px;border-radius:12px;min-height:46px;font-size:13px;font-weight:800;box-shadow:none}
.opt:active:not(:disabled){transform:translateY(2px);border-bottom-width:1.5px}
.opt.correct{border-color:var(--ok)!important;background:var(--ok-bg)!important}
.btn,.listen{border-radius:10px;border:1.5px solid var(--line);border-bottom-width:3.5px;font-weight:800;box-shadow:none;min-height:40px;font-size:13px}
.btn.primary{background:var(--pop);border-color:#C96A00;color:#2A1A0C}
.bar{height:8px;border-radius:8px;background:var(--line)}.bar i{background:var(--pop);border-radius:8px}
.icon-box{font-size:48px}
.select-group{flex:0 0 auto}
}
</style>
</head>

      <label class="select-group">

      <span id="score" class="score-pill" aria-live="polite">⭐ 0</span>

  <div class="stats-bar">

  <div class="nav-section">

    <div class="section-label" id="lblSub">Підрозділ</div>
    <div class="sub-wrapper">
      <nav class="nav-subs" id="subNav" aria-label="Subtopics"></nav>
    </div>

    <div class="section-label" id="lblMode">Режим</div>
    <div class="modes-wrapper" id="modeButtons"></div>
  </div>

  <div class="meta"><span id="prog"></span><span id="rnd"></span></div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="barfill"></i></div>
  <section class="card" id="card" aria-live="polite"></section>
  
  <footer>
    <span id="footText"></span>

  </footer>
</main>

function showSpeechNote(){const c=$("card");if(!c||$("speechNote"))return;const p=el("p","empty",getUI().noSpeech);p.id="speechNote";c.appendChild(p)}
function say(text){
 try{
  if(!("speechSynthesis" in window)||!("SpeechSynthesisUtterance" in window)){showSpeechNote();return}
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang={nl:"nl-BE",en:"en-GB",fr:"fr-BE"}[targetLang]||"nl-BE";u.rate=.86;
  const voices=window.speechSynthesis.getVoices(),pre=u.lang.toLowerCase().split("-")[0];
  const v=voices.find(x=>x.lang.toLowerCase()===u.lang.toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(pre));
  if(v)u.voice=v;
  u.onerror=e=>{if(!["interrupted","canceled","not-allowed"].includes(e.error))showSpeechNote()};
  window.speechSynthesis.speak(u);
 }catch(e){showSpeechNote()}
}

function makeOptions(cur){

  const arts=["de","het"];
  return shuffle(arts.map(l=>({label:l,ok:l===artOf(cur),t:true})));
 }
 const f=mode==="audio"?meaningFor:labelFor,t=mode!=="audio",correct=f(cur),seen=new Set([correct]),out=[];
 for(const x of shuffle(itemsFor().filter(x=>x.id!==cur.id))){
  const v=f(x);
  if(!seen.has(v)){seen.add(v);out.push({label:v,ok:false,c:x.c,t});if(out.length>=3)break}
 }

}

function renderClockFace(nlText){

 else if(nlText.includes("een uur")){hAngle=30;mAngle=0;}
 else if(nlText.includes("half twee")){hAngle=45;mAngle=180;}
 else{hAngle=0;mAngle=0;}

 const handH=el("div","clock-hand-h");handH.style.transform=`rotate(${hAngle}deg)`;

 wrap.append(handH,handM);

}

 bs.slots[k]=t;afterPlace();
}
function clearSlot(k){if(bs.done||bs.lock||!bs.slots[k])return;bs.slots[k]=null;bs.bad=[];renderBuild()}
function afterPlace(){if(bs.slots.every(Boolean))checkBuild();else renderBuild()}
function checkBuild(){
 const cur=bs,bad=cur.s.q.map((w,k)=>cur.slots[k].w===w?-1:k).filter(k=>k>=0);
 if(!bad.length){finishBuild();return}
 cur.stars=Math.max(1,cur.stars-1);cur.bad=bad;cur.lock=true;renderBuild();
 setTimeout(()=>{if(bs!==cur||cur.done)return;bad.forEach(k=>{cur.slots[k]=null});cur.bad=[];cur.lock=false;renderBuild()},850);
}
function hintBuild(){
 if(bs.done||bs.lock)return;
 const {s,slots,tiles}=bs,k=s.q.findIndex((w,i)=>!slots[i]||slots[i].w!==w);if(k<0)return;
 const t=tiles.find(x=>x.w===s.q[k]),j=slots.indexOf(t);if(j>=0)slots[j]=null;
 slots[k]=t;bs.stars=Math.max(1,bs.stars-1);bs.bad=[];afterPlace();
}
function finishBuild(){
 const cur=bs,s=cur.s;cur.done=true;locked=true;
 if(!s.again){
  const pts=cur.stars===3?10:cur.stars===2?7:4;score+=pts;roundPoints+=pts;
  if(cur.stars===3)right++;else{s.again=true;deck.unshift(s);roundTotal++}
  saveStore();updateStats();
 }
 renderBuild();
 say(sentence(s));
 setTimeout(()=>{
  const nx=$("nx");
  if(nx)nx.scrollIntoView({behavior:"smooth",block:"nearest"});
 },100);
}
function renderBuild(){
 const u=getUI(),s=bs.s;
 $("prog").textContent=u.lessonProgress+" "+q+" / "+roundTotal;$("rnd").textContent=u.round+" "+round+" · "+u.build;updateProgress();
 const card=$("card");card.replaceChildren();
 const levelBar=el("div","row build-levels");levelBar.style.justifyContent="center";levelBar.style.marginBottom="6px";levelBar.setAttribute("aria-label",u.buildLevel);[1,2].forEach(lv=>{const lb=el("button","btn"+(buildLevel===lv?" primary":""),u.buildLevel+" "+lv);lb.type="button";lb.setAttribute("aria-pressed",String(buildLevel===lv));lb.onclick=()=>{if(buildLevel!==lv){buildLevel=lv;newRound()}};levelBar.appendChild(lb)});card.appendChild(levelBar);
 const top=el("div","q");top.appendChild(el("small","",u.buildSub));
 if(bAudio&&!bs.done)top.appendChild(el("div","icon-box","🔊"));else top.appendChild(el("h2","sm",s[uiLang]||s.en));
 const tools=el("div","row");tools.style.justifyContent="center";
 const hear=el("button","listen",u.listen);hear.type="button";hear.onclick=()=>say(sentence(s));
 const ear=el("button","listen",(bAudio?"✓ ":"")+u.byEar);ear.type="button";
 ear.onclick=()=>{bAudio=!bAudio;renderBuild();if(bAudio&&!bs.done)say(sentence(s))};
 tools.append(hear,ear);top.appendChild(tools);card.appendChild(top);
 const slots=el("div","slots");
 s.roles.split("").forEach((r,k)=>{
  const w=el("div","sw2 r"+r);w.appendChild(el("span","role",u.roles[r]));
  const t=bs.slots[k],b=el("button","slot"+(t?" filled":"")+(bs.bad.includes(k)?" bad":"")+(bs.done?" good":""),t?t.w:"");
  b.type="button";if(t)tgt(b);b.onclick=()=>clearSlot(k);w.appendChild(b);slots.appendChild(w);
 });
 card.appendChild(slots);
 const bank=el("div","bank");
 if(!bs.done)bs.tiles.filter(t=>!bs.slots.includes(t)).forEach(t=>{const b=el("button","opt tile",t.w);tgt(b);b.type="button";b.onclick=()=>placeTile(t);bank.appendChild(b)});
 card.appendChild(bank);
 const fb=el("div","feedback");fb.id="feedback";
 if(bs.done){fb.appendChild(el("strong","","⭐".repeat(bs.stars)+" "+u.correct));fb.appendChild(tgt(el("p","example",sentence(s))));fb.appendChild(el("p","",s[uiLang]||s.en))}
 card.appendChild(fb);
 const row=el("div","row");
 if(bs.done){const nx=el("button","btn primary",u.next);nx.type="button";nx.id="nx";nx.onclick=nextQuestion;row.appendChild(nx)}
 else{const h=el("button","btn",u.hint);h.type="button";h.disabled=bs.lock;h.onclick=hintBuild;row.appendChild(h)}
 card.appendChild(row);
}

function updateModeButtons(){
 const u=getUI(),wrap=$("modeButtons");wrap.replaceChildren();
 [["study",u.study],["quiz",u.quiz],["audio",u.audio]].concat(targetLang==="nl"?[["build",u.build]]:[],[["review",u.reviewMode]]).forEach(([m,label])=>{
  const b=el("button",m===mode?"primary":"",label);b.type="button";
  b.onclick=()=>{mode=m;updateModeButtons();newRound()};wrap.appendChild(b);
 });
}

$("targetLangPicker").addEventListener("change",e=>changeTargetLang(e.target.value));
$("uiLangPicker").addEventListener("change",e=>changeUiLang(e.target.value));
$("themeToggle").addEventListener("click",()=>{
 const n=document.documentElement.dataset.theme==="dark"?"light":"dark";
 document.documentElement.dataset.theme=n;
 try{localStorage.setItem("poly_theme",n)}catch(e){}
 updateHeader();
});

function start(){
 try{
  const t=localStorage.getItem("poly_theme");
  if(t==="dark"||t==="light")document.documentElement.dataset.theme=t;
  else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.dataset.theme="dark";
 }catch(e){}
 updateHeader();buildNav();newRound();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", start);
} else {
  start();
}

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js", {scope: "./"}).catch(() => {});
  });
}
</script>
</body>
