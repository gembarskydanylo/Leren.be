<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com https://static.cloudflareinsights.com; connect-src 'self' https://*.googleapis.com https://leren-ai.gembarsky-d.workers.dev https://cloudflareinsights.com; frame-src 'self' https://leren-be.firebaseapp.com https://accounts.google.com; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#eb6a00">
<title>Huis van Pieter — прототип</title>
<link rel="icon" href="../../favicon-32.png">
<link rel="stylesheet" href="./huis.css?v=1">
</head>
<body>
<header class="h-top">
 <a class="h-back" href="../../">‹ lerenbe.com</a>
 <strong class="h-title">Huis van Pieter</strong>
 <span class="h-chip">прототип</span>
</header>
<main id="app" class="h-app">
 <section class="h-mission" id="mission" aria-live="polite">
  <div class="h-mission-row">
   <span class="h-step" id="step"></span>
   <span class="h-stars" id="stars"></span>
  </div>
  <div class="h-say">
   <button type="button" class="h-speak" id="speak" aria-label="Послухати ще раз"><img src="../../img/emoji/fx-1f50a.png" alt="" width="28" height="28"></button>
   <div class="h-say-text">
    <strong id="nl" lang="nl"></strong>
    <span id="uk"></span>
   </div>
  </div>
  <div class="h-tools">
   <button type="button" class="h-tool" id="trBtn">Переклад</button>
   <button type="button" class="h-tool" id="hintBtn">💡 Підказка</button>
  </div>
 </section>
 <section class="h-stage" id="stage">
  <div class="h-board" id="board" role="application" aria-label="Кімната. Ходи стрілками або торкнись підлоги."></div>
 </section>
 <section class="h-controls">
  <div class="h-pad" aria-label="Стрілки">
   <button type="button" class="h-arrow h-up" data-dir="0,-1" aria-label="Вгору">▲</button>
   <button type="button" class="h-arrow h-left" data-dir="-1,0" aria-label="Вліво">◀</button>
   <button type="button" class="h-arrow h-right" data-dir="1,0" aria-label="Вправо">▶</button>
   <button type="button" class="h-arrow h-down" data-dir="0,1" aria-label="Вниз">▼</button>
  </div>
  <div class="h-actions" id="actions"></div>
 </section>
</main>
<div class="h-overlay" id="overlay"></div>
<script src="./huis.js?v=1"></script>
</body>
</html>
