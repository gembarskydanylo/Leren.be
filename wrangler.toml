# Cloudflare Worker "leren-ai" (AI tutor proxy). Deployed by .github/workflows/deploy-worker.yml.
# Secrets are NOT here: ANTHROPIC_KEY stays in Cloudflare (Settings → Variables and Secrets) and survives deploys.
name = "leren-ai"
main = "tools/ai-worker.js"
account_id = "b0bf56f30d5188f0da28d699847e793d"
compatibility_date = "2025-09-01"
workers_dev = true
keep_vars = true

# Daily per-IP message limit (KV "leren-ai-rate")
[[kv_namespaces]]
binding = "RATE"
id = "09641fb73afe40d69bf47f75a7c15bf5"

# Spend guard (tools/ai-worker.js): at most 12 AI requests a minute per visitor, and 300 a minute for everybody
# together in one Cloudflare location. Counted by Cloudflare's rate limiter (no daily write quota, unlike KV).
[[ratelimits]]
name = "PER_IP"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 12
  period = 60

[[ratelimits]]
name = "ALL"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 300
  period = 60

# Workers Logs (AI_REPORT complaints are read here)
[observability]
enabled = true
